<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftari+ Sales</title><style>body{margin:0;font-family:Inter,Arial;background:#11142a;color:#f4f4fb}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:22px;font-weight:800}.muted{color:#a9abc4;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}.card{background:#1b1f3a;border:1px solid #30365d;border-radius:16px;padding:18px}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab{border:1px solid #343a65;background:#171a31;color:#ddd;padding:10px 14px;border-radius:10px;cursor:pointer}.tab.active{background:#7666ee;color:#fff}.section{display:none}.section.active{display:block}label{display:block;color:#b7bad1;font-size:13px;margin:12px 0 6px}input,select,button,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #3a4069;background:#14172c;color:#fff}button{background:#7666ee;border:0;font-weight:700;cursor:pointer}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #2c3152}.danger{background:#d95757}.success{color:#43dfa0}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.kpi{background:#171a31;border-radius:12px;padding:14px}.kpi b{display:block;font-size:20px;margin-top:4px}@media(max-width:800px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">Daftari+ <span style="color:#8b7cf6">Sales</span></div><div class="muted" id="who">Inapakia...</div></div><button id="logout" style="width:auto;padding:10px 18px">Toka</button></div><div class="tabs"><button class="tab active" data-tab="sale">🛒 Mauzo</button><button class="tab" data-tab="debt">💳 Madeni</button><button class="tab" data-tab="expense">💸 Matumizi</button><button class="tab" data-tab="history">📋 Historia</button></div><div class="kpis"><div class="kpi"><span class="muted">Mauzo yangu leo</span><b id="todaySales">0 TZS</b></div><div class="kpi"><span class="muted">Madeni niliyorekodi</span><b id="myDebt">0 TZS</b></div><div class="kpi"><span class="muted">Matumizi yangu</span><b id="myExpense">0 TZS</b></div></div><div id="sale" class="section active"><div class="grid"><div class="card"><h3>Record Sale</h3><form id="saleForm"><label>Bidhaa</label><select id="product" required></select><label>Quantity</label><input id="qty" type="number" min="1" value="1" required><label>Discount</label><input id="discount" type="number" min="0" value="0"><label>Malipo</label><select id="method"><option value="cash">Cash</option><option value="mobile">Mobile</option><option value="bank">Bank</option><option value="credit">Credit / Deni</option></select><div id="customerBox" style="display:none"><label>Mteja</label><select id="customer"></select></div><label>Total</label><div class="row"><b id="total">0 TZS</b></div><button type="submit">Kamilisha Mauzo</button><p id="saleMsg" class="muted"></p></form></div><div class="card"><h3>Mauzo Yangu</h3><div id="salesList"></div></div></div></div><div id="debt" class="section"><div class="grid"><div class="card"><h3>Record Deni</h3><form id="debtForm"><label>Jina la mteja</label><input id="debtName" required><label>Kiasi</label><input id="debtAmount" type="number" min="1" required><label>Maelezo</label><input id="debtDesc"><label>Tarehe ya malipo</label><input id="dueDate" type="date"><button>Hifadhi Deni</button><p id="debtMsg" class="muted"></p></form></div><div class="card"><h3>Madeni Niliyorekodi</h3><div id="debtsList"></div></div></div></div><div id="expense" class="section"><div class="grid"><div class="card"><h3>Record Matumizi</h3><form id="expenseForm"><label>Maelezo</label><input id="expenseDesc" required><label>Category</label><input id="expenseCat"><label>Kiasi</label><input id="expenseAmount" type="number" min="1" required><button>Hifadhi Matumizi</button><p id="expenseMsg" class="muted"></p></form></div><div class="card"><h3>Matumizi Niliyorekodi</h3><div id="expensesList"></div></div></div></div><div id="history" class="section"><div class="card"><h3>Historia ya Mauzo Yangu</h3><div id="historyList"></div></div></div></div><script>
const token=localStorage.getItem('dp_token');if(!token)location='/login.html';let products=[],customers=[];const $=id=>document.getElementById(id),money=n=>Math.round(Number(n)||0).toLocaleString('en-US')+' TZS';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}});if(r.status===401){localStorage.removeItem('dp_token');location='/login.html';return}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Hitilafu');return d}
async function init(){const me=await api('/api/me');if(!me)return;if(me.user.role!=='saler'){location='/dashboard.html';return}$('who').textContent=`${me.user.full_name} · ${me.business?.name||''} · Muuzaji`;const pd=await api('/api/products');products=pd.products||[];$('product').innerHTML='<option value="">Chagua bidhaa...</option>'+products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.sell_price)} · Stock ${p.quantity}</option>`).join('');const cu=await api('/api/customers');customers=cu.customers||[];$('customer').innerHTML='<option value="">Chagua mteja...</option>'+customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');await refresh()}
function calc(){const p=products.find(x=>x.id==$('product').value);const q=Number($('qty').value)||0,d=Number($('discount').value)||0;$('total').textContent=money(p?Math.max(0,p.sell_price*q-d):0)}$('product').onchange=calc;$('qty').oninput=calc;$('discount').oninput=calc;$('method').onchange=e=>$('customerBox').style.display=e.target.value==='credit'?'block':'none';
async function refresh(){const [s,d,e]=await Promise.all([api('/api/sales'),api('/api/debts'),api('/api/expenses')]);const sales=s.sales||[],debts=d.debts||[],ex=e.expenses||[];const today=new Date().toISOString().slice(0,10);$('todaySales').textContent=money(sales.filter(x=>String(x.created_at).slice(0,10)===today).reduce((a,x)=>a+Number(x.total),0));$('myDebt').textContent=money(debts.reduce((a,x)=>a+Math.max(0,Number(x.amount)-Number(x.paid)),0));$('myExpense').textContent=money(ex.reduce((a,x)=>a+Number(x.amount),0));$('salesList').innerHTML=sales.slice(0,12).map(x=>`<div class="row"><span>${esc(x.product_name)} ×${x.quantity}<br><small class="muted">${new Date(x.created_at).toLocaleString('sw-TZ')}</small></span><b>${money(x.total)}</b></div>`).join('')||'<p class="muted">Hakuna mauzo.</p>';$('historyList').innerHTML=$('salesList').innerHTML;$('debtsList').innerHTML=debts.map(x=>`<div class="row"><span>${esc(x.customer_name||x.person_name)}<br><small class="muted">${esc(x.description||'')}</small></span><b>${money(Number(x.amount)-Number(x.paid))}</b></div>`).join('')||'<p class="muted">Hakuna madeni.</p>';$('expensesList').innerHTML=ex.map(x=>`<div class="row"><span>${esc(x.description)}<br><small class="muted">${esc(x.category||'')}</small></span><b>${money(x.amount)}</b></div>`).join('')||'<p class="muted">Hakuna matumizi.</p>'}
$('saleForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/sales',{method:'POST',body:JSON.stringify({productId:Number($('product').value),quantity:Number($('qty').value),discount:Number($('discount').value)||0,paymentMethod:$('method').value,customerId:$('method').value==='credit'?Number($('customer').value)||null:null})});$('saleMsg').textContent='Mauzo yamehifadhiwa ✓';$('saleForm').reset();$('customerBox').style.display='none';calc();await init()}catch(x){$('saleMsg').textContent=x.message}};$('debtForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/debts',{method:'POST',body:JSON.stringify({personName:$('debtName').value,amount:Number($('debtAmount').value),description:$('debtDesc').value,dueDate:$('dueDate').value})});$('debtMsg').textContent='Deni limehifadhiwa ✓';e.target.reset();refresh()}catch(x){$('debtMsg').textContent=x.message}};$('expenseForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/expenses',{method:'POST',body:JSON.stringify({description:$('expenseDesc').value,category:$('expenseCat').value,amount:Number($('expenseAmount').value)})});$('expenseMsg').textContent='Matumizi yamehifadhiwa ✓';e.target.reset();refresh()}catch(x){$('expenseMsg').textContent=x.message}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});$('logout').onclick=async()=>{try{await api('/api/logout')}catch{}localStorage.removeItem('dp_token');localStorage.removeItem('dp_user');location='/login.html'};init().catch(e=>console.error(e));
</script></body></html>
