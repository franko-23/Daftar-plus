<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftari+ Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#F3F4F9;--panel:#FFFFFF;--line:#E7E8F2;--text:#171A2B;--muted:#6B7290;--accent:#8B7CF6;--accent2:#6C5CE7;--good:#0FA968;--bad:#DC2626;--radius:16px;
--side-bg:#171233;--side-line:rgba(255,255,255,.08);--side-text:#F3F1FF;--side-muted:#9C96C4}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:'Inter',Arial,sans-serif;overflow-x:hidden}
h1,h3{font-family:'Poppins',sans-serif;font-weight:600}
button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.app{display:flex;min-height:100vh}

.drawer-overlay{position:fixed;inset:0;background:rgba(10,8,30,.5);backdrop-filter:blur(2px);z-index:60;display:none}
.drawer-overlay.show{display:block}

.sidebar{width:240px;background:var(--side-bg);border-right:1px solid var(--side-line);padding:22px 14px;
  position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:70;
  transform:translateX(-104%);transition:transform .28s ease;overflow-y:auto}
.sidebar.open{transform:translateX(0)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-family:'Poppins',sans-serif;font-size:19px;padding:4px 10px 24px;color:var(--side-text)}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--accent),var(--accent2));display:grid;place-items:center;flex-shrink:0}
.plus{color:var(--accent)}
.nav{display:grid;gap:4px}
.tab{border:0;border-left:3px solid transparent;background:transparent;color:var(--side-muted);padding:12px 13px;border-radius:0 10px 10px 0;text-align:left;font-weight:600;font-family:'Inter',sans-serif;font-size:14px;width:100%}
.tab.active,.tab:hover{background:rgba(139,124,246,.16);color:#fff;border-left-color:var(--accent)}
.side-bottom{margin-top:auto;border-top:1px solid var(--side-line);padding-top:15px}
.side-bottom .who{font-size:12px;color:var(--side-muted)}
#logout{width:100%;margin-top:13px;background:rgba(255,255,255,.05);border:1px solid var(--side-line);color:var(--side-text);padding:9px;border-radius:10px;font-size:12.5px;font-weight:600}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(243,244,249,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 20px}
.topbar .tb-left{display:flex;align-items:center;gap:14px}
.hamburger{width:38px;height:38px;flex-shrink:0;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center}
.hamburger span{display:block;width:16px;height:2px;background:var(--text);position:relative}
.hamburger span::before,.hamburger span::after{content:"";position:absolute;left:0;width:16px;height:2px;background:var(--text)}
.hamburger span::before{top:-5px}.hamburger span::after{top:5px}
.tb-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:17px}
.tb-pill{background:#F6F7FB;border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}

.main{flex:1;min-width:0;padding:22px 20px 60px;max-width:1100px;margin:auto;width:100%}
.title h1{margin:0;font-size:22px}
.title p{margin:4px 0 20px;color:var(--muted);font-size:13.5px}

.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px;min-width:0}
.grid>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 1px 3px rgba(20,20,50,.04);min-width:0}
.card h3{font-size:16px;margin:0 0 4px;color:var(--text)}
.section{display:none}.section.active{display:block}
label{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin:14px 0 7px}
input,select,textarea,form button{width:100%;box-sizing:border-box;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;font-family:'Inter',sans-serif}
input:focus,select:focus{outline:none;border-color:var(--accent)}
form button{background:var(--text);color:#fff;border:none;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:none}
.success{color:var(--good)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(20,20,50,.04)}
.kpi:nth-child(1){border-top-color:#14B8A6}
.kpi:nth-child(2){border-top-color:#DC2626}
.kpi:nth-child(3){border-top-color:#D97706}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-size:19px;margin-top:6px;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text)}
@media(max-width:800px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="16" height="16" stroke="#fff" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></span>Daftari<span class="plus">+</span></div>
  <nav class="nav">
    <button class="tab active" data-tab="sale">🛒 Mauzo</button>
    <button class="tab" data-tab="debt">💳 Madeni</button>
    <button class="tab" data-tab="expense">💸 Matumizi</button>
    <button class="tab" data-tab="history">📋 Historia</button>
  </nav>
  <div class="side-bottom"><div class="who" id="who">Inapakia...</div><button id="logout">Toka</button></div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="tb-left">
      <button class="hamburger" id="hamburgerBtn" aria-label="menu"><span></span></button>
      <div class="tb-title">Mauzo</div>
    </div>
    <div class="tb-pill" id="tbPill">Muuzaji</div>
  </div>

  <div class="title"><h1>Sales Overview</h1><p id="subTitle"></p></div>

  <div class="kpis">
    <div class="kpi"><span>Mauzo yangu leo</span><b id="todaySales">0 TZS</b></div>
    <div class="kpi"><span>Madeni niliyorekodi</span><b id="myDebt">0 TZS</b></div>
    <div class="kpi"><span>Matumizi yangu</span><b id="myExpense">0 TZS</b></div>
  </div>

  <div id="sale" class="section active">
    <div class="grid">
      <div class="card"><h3>Record Sale</h3><form id="saleForm">
        <label>Bidhaa</label><select id="product" required></select>
        <label>Quantity</label><input id="qty" type="number" min="1" value="1" required>
        <label>Discount</label><input id="discount" type="number" min="0" value="0">
        <label>Malipo</label><select id="method"><option value="cash">Cash</option><option value="mobile">Mobile</option><option value="bank">Bank</option><option value="credit">Credit / Deni</option></select>
        <div id="customerBox" style="display:none"><label>Mteja</label><select id="customer"></select></div>
        <label>Total</label><div class="row"><b id="total" style="font-family:'JetBrains Mono',monospace;">0 TZS</b></div>
        <button type="submit">Kamilisha Mauzo</button>
        <p id="saleMsg" class="muted"></p>
      </form></div>
      <div class="card"><h3>Mauzo Yangu</h3><div id="salesList"></div></div>
    </div>
  </div>

  <div id="debt" class="section">
    <div class="grid">
      <div class="card"><h3>Record Deni</h3><form id="debtForm">
        <label>Jina la mteja</label><input id="debtName" required>
        <label>Kiasi</label><input id="debtAmount" type="number" min="1" required>
        <label>Maelezo</label><input id="debtDesc">
        <label>Tarehe ya malipo</label><input id="dueDate" type="date">
        <button>Hifadhi Deni</button>
        <p id="debtMsg" class="muted"></p>
      </form></div>
      <div class="card"><h3>Madeni Niliyorekodi</h3><div id="debtsList"></div></div>
    </div>
  </div>

  <div id="expense" class="section">
    <div class="grid">
      <div class="card"><h3>Record Matumizi</h3><form id="expenseForm">
        <label>Maelezo</label><input id="expenseDesc" required>
        <label>Category</label><input id="expenseCat">
        <label>Kiasi</label><input id="expenseAmount" type="number" min="1" required>
        <button>Hifadhi Matumizi</button>
        <p id="expenseMsg" class="muted"></p>
      </form></div>
      <div class="card"><h3>Matumizi Niliyorekodi</h3><div id="expensesList"></div></div>
    </div>
  </div>

  <div id="history" class="section">
    <div class="card"><h3>Historia ya Mauzo Yangu</h3><div id="historyList"></div></div>
  </div>
</main>
</div>

<script>
(() => {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('drawerOverlay');
  const hamburger = document.getElementById('hamburgerBtn');
  function openDrawer(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
  function closeDrawer(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
  hamburger.addEventListener('click', openDrawer);
  overlay.addEventListener('click', closeDrawer);
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', closeDrawer));

  const titles = {sale:'Mauzo', debt:'Madeni', expense:'Matumizi', history:'Historia'};
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    document.querySelector('.tb-title').textContent = titles[b.dataset.tab] || 'Mauzo';
  }));
  document.getElementById('subTitle').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
})();
</script>

<script>
const token=localStorage.getItem('dp_token');if(!token)location='/login.html';let products=[],customers=[];const $=id=>document.getElementById(id),money=n=>Math.round(Number(n)||0).toLocaleString('en-US')+' TZS';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}});if(r.status===401){localStorage.removeItem('dp_token');location='/login.html';return}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Hitilafu');return d}
async function init(){const me=await api('/api/me');if(!me)return;if(me.user.role!=='saler'){location='/dashboard.html';return}$('who').textContent=`${me.user.full_name} · Muuzaji`;$('tbPill').textContent=`Muuzaji — ${me.business?.name||''}`;const pd=await api('/api/products');products=pd.products||[];$('product').innerHTML='<option value="">Chagua bidhaa...</option>'+products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.sell_price)} · Stock ${p.quantity}</option>`).join('');const cu=await api('/api/customers');customers=cu.customers||[];$('customer').innerHTML='<option value="">Chagua mteja...</option>'+customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');await refresh()}
function calc(){const p=products.find(x=>x.id==$('product').value);const q=Number($('qty').value)||0,d=Number($('discount').value)||0;$('total').textContent=money(p?Math.max(0,p.sell_price*q-d):0)}$('product').onchange=calc;$('qty').oninput=calc;$('discount').oninput=calc;$('method').onchange=e=>$('customerBox').style.display=e.target.value==='credit'?'block':'none';
async function refresh(){const [s,d,e]=await Promise.all([api('/api/sales'),api('/api/debts'),api('/api/expenses')]);const sales=s.sales||[],debts=d.debts||[],ex=e.expenses||[];const today=new Date().toISOString().slice(0,10);$('todaySales').textContent=money(sales.filter(x=>String(x.created_at).slice(0,10)===today).reduce((a,x)=>a+Number(x.total),0));$('myDebt').textContent=money(debts.reduce((a,x)=>a+Math.max(0,Number(x.amount)-Number(x.paid)),0));$('myExpense').textContent=money(ex.reduce((a,x)=>a+Number(x.amount),0));$('salesList').innerHTML=sales.slice(0,12).map(x=>`<div class="row"><span>${esc(x.product_name)} ×${x.quantity}<br><small class="muted">${new Date(x.created_at).toLocaleString('sw-TZ')}</small></span><b>${money(x.total)}</b></div>`).join('')||'<p class="muted">Hakuna mauzo.</p>';$('historyList').innerHTML=$('salesList').innerHTML;$('debtsList').innerHTML=debts.map(x=>`<div class="row"><span>${esc(x.customer_name||x.person_name)}<br><small class="muted">${esc(x.description||'')}</small></span><b>${money(Number(x.amount)-Number(x.paid))}</b></div>`).join('')||'<p class="muted">Hakuna madeni.</p>';$('expensesList').innerHTML=ex.map(x=>`<div class="row"><span>${esc(x.description)}<br><small class="muted">${esc(x.category||'')}</small></span><b>${money(x.amount)}</b></div>`).join('')||'<p class="muted">Hakuna matumizi.</p>'}
$('saleForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/sales',{method:'POST',body:JSON.stringify({productId:Number($('product').value),quantity:Number($('qty').value),discount:Number($('discount').value)||0,paymentMethod:$('method').value,customerId:$('method').value==='credit'?Number($('customer').value)||null:null})});$('saleMsg').textContent='Mauzo yamehifadhiwa ✓';$('saleForm').reset();$('customerBox').style.display='none';calc();await init()}catch(x){$('saleMsg').textContent=x.message}};$('debtForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/debts',{method:'POST',body:JSON.stringify({personName:$('debtName').value,amount:Number($('debtAmount').value),description:$('debtDesc').value,dueDate:$('dueDate').value})});$('debtMsg').textContent='Deni limehifadhiwa ✓';e.target.reset();refresh()}catch(x){$('debtMsg').textContent=x.message}};$('expenseForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/expenses',{method:'POST',body:JSON.stringify({description:$('expenseDesc').value,category:$('expenseCat').value,amount:Number($('expenseAmount').value)})});$('expenseMsg').textContent='Matumizi yamehifadhiwa ✓';e.target.reset();refresh()}catch(x){$('expenseMsg').textContent=x.message}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});$('logout').onclick=async()=>{try{await api('/api/logout')}catch{}localStorage.removeItem('dp_token');localStorage.removeItem('dp_user');location='/login.html'};init().catch(e=>console.error(e));
</script>

</body>
</html>
