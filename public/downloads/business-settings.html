<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Settings — Daftari+</title><link rel="stylesheet" href="/css/fama-theme.css"><style>
body{margin:0;font-family:Inter,system-ui;background:var(--df-bg);color:var(--df-text)}.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:21px;font-weight:800}.brand span{color:var(--df-primary)}.btn{padding:10px 14px;border:1px solid var(--df-line);background:#fff;font-weight:700;cursor:pointer}.primary{background:var(--df-primary)!important;color:#fff!important}.card{padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 6px}.field input{width:100%;padding:11px;border:1px solid var(--df-line);box-sizing:border-box}.full{grid-column:1/-1}.muted{color:var(--df-muted)}.code{background:var(--df-primary-soft);padding:14px;border-radius:12px;font-weight:800;color:var(--df-primary-dark)}#msg{margin-top:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">Daftari<span>+</span></div><div class="muted">Business Settings</div></div><button class="btn" onclick="location.href='/dashboard.html'">← Dashboard</button></div><div class="card"><h2 style="margin-top:0">Taarifa za biashara</h2><p class="muted">Badilisha taarifa za biashara yako. Business code inaweza kutumika kuwaunganisha sellers.</p><div id="code" class="code" style="display:none"></div><form id="form"><div class="grid"><div class="field"><label>Jina la biashara</label><input id="name" required></div><div class="field"><label>Aina ya biashara</label><input id="type"></div><div class="field"><label>Simu ya biashara</label><input id="phone"></div><div class="field"><label>Nchi</label><input id="country"></div><div class="field"><label>Mkoa / Region</label><input id="region"></div><div class="field"><label>Wilaya / District</label><input id="district"></div><div class="field"><label>Kata / Ward</label><input id="ward"></div><div class="field full"><label>Mahali / Location</label><input id="location"></div></div><button class="btn primary" style="margin-top:18px">Hifadhi Mabadiliko</button></form><div id="msg" class="muted"></div></div></div><script>
const token=localStorage.getItem('daftari_token');if(!token)location.href='/login.html';const $=id=>document.getElementById(id);async function api(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('daftari_token');location.href='/login.html';return null}if(!r.ok)throw Error(d.error||'Hitilafu');return d}async function load(){try{const me=await api('/api/me');if(!me)return;if(me.user.role!=='owner'){location.href='/dashboard.html';return}const d=await api('/api/business');const b=d.business;['name','type','phone','country','region','district','ward','location'].forEach(k=>$(k).value=b[k]||'');$('code').textContent='Business Code: '+(b.code||'—');$('code').style.display='block'}catch(e){$('msg').textContent=e.message}}$('form').onsubmit=async e=>{e.preventDefault();try{const body={};['name','type','phone','country','region','district','ward','location'].forEach(k=>body[k]=$(k).value);await api('/api/business',{method:'PATCH',body:JSON.stringify(body)});$('msg').textContent='✓ Taarifa zimehifadhiwa.'}catch(x){$('msg').textContent=x.message}};load();
</script></body></html>
