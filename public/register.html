<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sajili — Daftari Plus</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth"><div style="width:min(440px,100%)"><a href="/" style="display:inline-block;margin-bottom:14px;color:#5b6470;font-size:13px;text-decoration:none">← Nyumbani</a><div class="card">
<div style="width:56px;height:56px;border-radius:14px;background:#0757e8;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin:0 auto 10px">D+</div>
<h1 style="text-align:center">Fungua Akaunti</h1>
<p style="text-align:center;margin-top:-6px">Anza kusimamia biashara yako leo</p>
<div id="msg"></div>
<form id="f">

<div class="field-label">Aina ya Akaunti</div>
<div class="role-cards">
  <label class="role-card">
    <input type="radio" name="role" value="admin" checked>
    <b>Naanzisha Biashara</b>
    <small>Admin — biashara mpya</small>
  </label>
  <label class="role-card">
    <input type="radio" name="role" value="saler">
    <b>Ninajiunga</b>
    <small>Muuzaji — na Business Code</small>
  </label>
</div>

<div class="field-label">Taarifa Zako</div>
<input id="fullName" placeholder="Jina kamili" required>
<input id="phone" type="tel" placeholder="Namba ya simu (mfano 07XXXXXXXX)" required>
<input id="email" type="email" placeholder="Barua pepe (Email)" required>
<input id="password" type="password" placeholder="Password (angalau herufi 8)" minlength="8" required>

<div id="adminFields">
  <div class="field-label">Taarifa za Biashara</div>
  <input id="businessName" placeholder="Jina la biashara">
  <input id="businessLocation" placeholder="Mahali biashara ilipo (mfano Kariakoo, Dar es Salaam)">
</div>

<div id="salerFields" style="display:none">
  <div class="field-label">Business Code</div>
  <input id="businessCode" placeholder="Weka Business Code uliyopewa" style="text-transform:uppercase">
</div>

<button style="margin-top:6px">Fungua Akaunti</button>
</form>
<a href="/login.html" style="text-align:center">Tayari una akaunti? Ingia</a>
</div></div></main>
<script src="/js/register.js"></script>
</body></html>
