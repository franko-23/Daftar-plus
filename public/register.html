<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftari+ | Fungua Akaunti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00BFA6; --teal-dark:#009984; --teal-soft:#E3FBF7;
  --bg:#F7FBFA; --panel:#FFFFFF; --text:#0B1E1C; --text-dim:#5B6E6B; --text-faint:#8FA19E;
  --border:#E3ECEA; --danger:#DC2626; --danger-soft:#FEF2F2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;color:var(--text)}
.container{width:100%;max-width:460px}
.mark{width:76px;height:76px;margin:0 auto 20px;border-radius:22px;background:linear-gradient(135deg,var(--teal),#00E0C0);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Poppins',sans-serif;font-weight:800;font-size:26px;box-shadow:0 10px 26px rgba(0,191,166,.3)}
h1{font-family:'Poppins',sans-serif;font-weight:800;font-size:26px;text-align:center;letter-spacing:-.02em;margin-bottom:8px}
.subtitle{text-align:center;color:var(--text-dim);font-size:14px;margin-bottom:26px;line-height:1.5}

.role-toggle{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:22px}
.role-toggle button{flex:1;border:0;background:transparent;padding:11px 8px;border-radius:11px;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--text-dim);cursor:pointer}
.role-toggle button.active{background:var(--teal);color:#fff;box-shadow:0 6px 14px rgba(0,191,166,.28)}

.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px}
.section-label{font-size:11.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 10px}
.section-label:first-child{margin-top:0}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
input,select{width:100%;height:48px;border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:14px;outline:none;background:#fff;font-family:inherit;color:var(--text)}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.hint{font-size:12px;color:var(--text-faint);margin-top:5px}
.password-wrap{position:relative}
.password-wrap input{padding-right:52px}
.toggle-password{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;color:var(--text-dim);font-size:12.5px;padding:5px}

.submit-btn{width:100%;height:52px;border:0;border-radius:14px;background:var(--teal);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(0,191,166,.28);margin-top:6px;font-family:inherit}
.submit-btn:hover{background:var(--teal-dark)}
.submit-btn:disabled{opacity:.65;cursor:not-allowed}

.message{display:none;margin-bottom:16px;padding:11px 14px;border-radius:11px;font-size:13.5px;line-height:1.4}
.message.error{display:block;background:var(--danger-soft);color:var(--danger);border:1px solid #fecaca}
.message.success{display:block;background:var(--teal-soft);color:var(--teal-dark);border:1px solid #b8f0e6}

.login-row{text-align:center;margin-top:22px;color:var(--text-dim);font-size:14px}
.login-row a{color:var(--teal-dark);font-weight:700;text-decoration:none}
.footer-note{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:24px;color:var(--text-faint);font-size:12.5px}
</style>
</head>
<body>

<div class="container">
  <div class="mark">D+</div>
  <h1>Fungua Akaunti</h1>
  <p class="subtitle">Anza kusimamia biashara yako na Daftari+ leo.</p>

  <div id="message" class="message"></div>

  <div class="role-toggle">
    <button type="button" class="active" id="ownerToggle">Mmiliki wa Biashara</button>
    <button type="button" id="salerToggle">Mfanyakazi (Saler)</button>
  </div>

  <div class="card">
    <form id="registerForm">
      <div class="section-label">Taarifa Zako</div>
      <div class="form-row">
        <div class="form-group"><label>Jina Kamili</label><input id="fullName" type="text" placeholder="Jina lako" required></div>
        <div class="form-group"><label>Namba ya Simu</label><input id="phone" type="tel" placeholder="0700 000 000" required></div>
      </div>
      <div class="form-group"><label>Barua Pepe</label><input id="email" type="email" placeholder="jina@biashara.com" required></div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrap">
          <input id="password" type="password" placeholder="••••••••" required minlength="10">
          <button type="button" class="toggle-password" id="togglePassword">Onyesha</button>
        </div>
        <div class="hint">Angalau herufi 10.</div>
      </div>

      <div id="ownerFields">
        <div class="section-label">Taarifa za Biashara</div>
        <div class="form-group"><label>Jina la Biashara</label><input id="businessName" type="text" placeholder="Mfano: Amina's Shop"></div>
        <div class="form-row">
          <div class="form-group"><label>Namba ya Simu ya Biashara</label><input id="businessPhone" type="tel" placeholder="0700 000 000"></div>
          <div class="form-group"><label>Nchi</label><input id="country" type="text" placeholder="Tanzania" value="Tanzania"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Mkoa</label><input id="region" type="text" placeholder="Dar es Salaam"></div>
          <div class="form-group"><label>Wilaya</label><input id="district" type="text" placeholder="Kinondoni"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Kata</label><input id="ward" type="text" placeholder="Mikocheni"></div>
          <div class="form-group"><label>Eneo / Mtaa</label><input id="businessLocation" type="text" placeholder="Mtaa, jengo, n.k"></div>
        </div>
      </div>

      <div id="salerFields" style="display:none">
        <div class="section-label">Taarifa za Biashara</div>
        <div class="form-group">
          <label>Business Code</label>
          <input id="businessCode" type="text" placeholder="Mfano: DP-24X9K">
          <div class="hint">Omba Business Code kwa mmiliki wa duka unalofanyia kazi.</div>
        </div>
      </div>

      <div class="form-group" style="margin-top:14px">
        <label>Nambari ya Rufaa (Hiari)</label>
        <input id="referralCode" type="text" placeholder="Kama unayo">
      </div>

      <button type="submit" class="submit-btn" id="registerBtn">Fungua Akaunti</button>
    </form>
  </div>

  <div class="login-row">Tayari una akaunti? <a href="/login.html">Ingia</a></div>
  <div class="footer-note">🔒 Taarifa za biashara yako ziko salama na faragha</div>
</div>

<script>
const $ = id => document.getElementById(id);
let role = 'owner';

(function prefillReferral(){
  const params = new URLSearchParams(location.search);
  const ref = params.get('ref') || params.get('referral') || params.get('referralCode');
  if(ref) $('referralCode').value = ref;
})();

function showMessage(text, type='error'){
  const el = $('message');
  el.textContent = text;
  el.className = 'message ' + type;
}
function clearMessage(){ $('message').textContent = ''; $('message').className = 'message'; }

$('ownerToggle').addEventListener('click', () => {
  role = 'owner';
  $('ownerToggle').classList.add('active');
  $('salerToggle').classList.remove('active');
  $('ownerFields').style.display = 'block';
  $('salerFields').style.display = 'none';
});
$('salerToggle').addEventListener('click', () => {
  role = 'saler';
  $('salerToggle').classList.add('active');
  $('ownerToggle').classList.remove('active');
  $('salerFields').style.display = 'block';
  $('ownerFields').style.display = 'none';
});

$('togglePassword').addEventListener('click', () => {
  const inp = $('password');
  if(inp.type === 'password'){ inp.type = 'text'; $('togglePassword').textContent = 'Ficha'; }
  else { inp.type = 'password'; $('togglePassword').textContent = 'Onyesha'; }
});

function saveSession(data){
  if(!data || !data.token || !data.user) throw new Error('Server haikurudisha taarifa sahihi.');
  localStorage.setItem('dp_token', data.token);
  localStorage.setItem('dp_user', JSON.stringify(data.user));
}

function redirectUser(user){
  if(!user || !user.role){ window.location.replace('/login.html'); return; }
  if(user.role === 'super_admin'){ window.location.replace('/super-admin.html'); return; }
  if(user.role === 'owner'){ window.location.replace('/dashboard.html'); return; }
  if(user.role === 'saler' || user.role === 'seller'){ window.location.replace('/saler.html'); return; }
  window.location.replace('/login.html');
}

async function api(path, options={}){
  const headers = { 'Content-Type': 'application/json', ...(options.headers||{}) };
  const response = await fetch(path, { ...options, headers });
  let data = {};
  try{ data = await response.json(); }catch{}
  if(!response.ok){
    const error = new Error(data.error || data.message || 'Kuna tatizo kwenye server.');
    error.status = response.status;
    error.data = data;
    throw error;
  }
  return data;
}

$('registerForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  clearMessage();

  const fullName = $('fullName').value.trim();
  const phone = $('phone').value.trim();
  const email = $('email').value.trim();
  const password = $('password').value;
  const referralCode = $('referralCode').value.trim();

  if(!fullName || !phone || !email || !password){
    showMessage('Tafadhali jaza sehemu zote zinazohitajika.');
    return;
  }
  if(password.length < 10){
    showMessage('Password inatakiwa kuwa angalau herufi 10.');
    return;
  }

  const payload = { fullName, phone, email, password, role, referralCode: referralCode || undefined };

  if(role === 'owner'){
    const businessName = $('businessName').value.trim();
    const businessPhone = $('businessPhone').value.trim();
    const country = $('country').value.trim();
    const region = $('region').value.trim();
    const district = $('district').value.trim();
    const ward = $('ward').value.trim();
    const businessLocation = $('businessLocation').value.trim();

    if(!businessName || !businessPhone || !country || !region || !district || !ward || !businessLocation){
      showMessage('Tafadhali jaza taarifa zote za biashara.');
      return;
    }

    Object.assign(payload, { businessName, businessPhone, country, region, district, ward, businessLocation });
  }else{
    const businessCode = $('businessCode').value.trim().toUpperCase();
    if(!businessCode){
      showMessage('Tafadhali ingiza Business Code.');
      return;
    }
    payload.businessCode = businessCode;
  }

  const btn = $('registerBtn');
  btn.disabled = true;
  btn.textContent = 'Inafungua akaunti...';

  try{
    const data = await api('/api/register', { method: 'POST', body: JSON.stringify(payload) });
    saveSession(data);
    showMessage('Akaunti imefunguliwa. Tunaelekeza...', 'success');
    setTimeout(() => redirectUser(data.user), 300);
  }catch(error){
    let errorMessage = 'Imeshindikana kufungua akaunti. Jaribu tena.';
    if(error && error.data && (error.data.error || error.data.message)) errorMessage = error.data.error || error.data.message;
    else if(error && error.message) errorMessage = error.message;
    showMessage(errorMessage);
  }finally{
    btn.disabled = false;
    btn.textContent = 'Fungua Akaunti';
  }
});
</script>

</body>
</html>
