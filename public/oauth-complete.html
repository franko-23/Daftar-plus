<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kamilisha Akaunti — Daftari+</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f4f7f6;
  color:#111827;
  font-family:Inter,Arial,sans-serif
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:30px 18px 50px
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:20px;
  padding:24px;
  box-shadow:0 8px 30px rgba(15,23,42,.06)
}

.logo{
  width:52px;
  height:52px;
  border-radius:15px;
  background:linear-gradient(145deg,#10b981,#047857);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  margin-bottom:18px
}

h1{
  font-size:25px;
  margin:0 0 7px
}

.sub{
  color:#6b7280;
  font-size:14px;
  margin:0 0 20px
}

.provider{
  background:#ecfdf5;
  color:#047857;
  border-radius:10px;
  padding:10px 12px;
  font-size:13px;
  margin-bottom:20px
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:20px
}

.tabs button{
  height:44px;
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:12px;
  font-weight:800;
  cursor:pointer
}

.tabs button.active{
  background:#10b981;
  color:#fff;
  border-color:#10b981
}

.field{
  margin-bottom:14px
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px
}

.field input,
.field select{
  width:100%;
  height:48px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:0 12px;
  background:#fff;
  font-size:14px;
  outline:none
}

.field input:focus,
.field select:focus{
  border-color:#10b981;
  box-shadow:0 0 0 3px rgba(16,185,129,.1)
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.primary{
  width:100%;
  height:50px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;
  font-weight:800;
  font-size:15px;
  margin-top:7px
}

.primary:disabled{
  opacity:.6
}

.error{
  display:none;
  background:#fef2f2;
  color:#b91c1c;
  border:1px solid #fecaca;
  padding:10px;
  border-radius:11px;
  font-size:13px;
  margin-bottom:14px
}

.hidden{
  display:none!important
}

.loading{
  text-align:center;
  color:#6b7280;
  padding:35px 0
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card" id="app">
    <div class="loading">
      Inathibitisha account...
    </div>
  </div>
</div>

<script>

const app =
  document.getElementById('app');

const ticket =
  new URLSearchParams(location.search).get('ticket');

let info = null;
let role = 'owner';


function esc(v){
  return String(v || '').replace(
    /[&<>'"]/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );
}


function errorBox(t){

  const e =
    document.getElementById('err');

  if(e){
    e.textContent = t;
    e.style.display = 'block';
  }

}


function renderSignup(){

  app.innerHTML = `

    <div class="logo">
      D+
    </div>

    <h1>
      Kamilisha akaunti yako
    </h1>

    <p class="sub">
      Account yako imethibitishwa.
      Kamilisha taarifa chache ili
      uanze kutumia Daftari+.
    </p>

    <div class="provider">
      ${esc(
        info.provider === 'google'
          ? 'Google'
          : 'Apple'
      )}
      •
      ${esc(info.email)}
    </div>

    <div class="tabs">

      <button
        id="ownerTab"
        class="active"
        onclick="setRole('owner')">
        Owner
      </button>

      <button
        id="salerTab"
        onclick="setRole('saler')">
        Saler
      </button>

    </div>

    <div id="err" class="error"></div>

    <form id="form">

      <div class="field">

        <label>
          Jina kamili
        </label>

        <input
          id="fullName"
          value="${esc(info.fullName)}"
          required>

      </div>


      <div class="field">

        <label>
          Namba ya simu
        </label>

        <input
          id="phone"
          inputmode="tel"
          placeholder="07XXXXXXXX"
          required>

      </div>


      <div id="ownerFields">

        <div class="field">

          <label>
            Jina la biashara
          </label>

          <input
            id="businessName"
            placeholder="Mf. Daftari Shop">

        </div>


        <div class="field">

          <label>
            Aina ya biashara
          </label>

          <input
            id="businessType"
            placeholder="Mf. Duka, Salon, Restaurant">

        </div>


        <div class="field">

          <label>
            Simu ya biashara
          </label>

          <input
            id="businessPhone"
            inputmode="tel"
            placeholder="07XXXXXXXX">

        </div>


        <div class="grid">

          <div class="field">

            <label>
              Mkoa
            </label>

            <input
              id="region"
              placeholder="Mkoa">

          </div>


          <div class="field">

            <label>
              Wilaya
            </label>

            <input
              id="district"
              placeholder="Wilaya">

          </div>

        </div>


        <div class="field">

          <label>
            Kata
          </label>

          <input
            id="ward"
            placeholder="Kata">

        </div>


        <div class="field">

          <label>
            Eneo / Anwani ya biashara
          </label>

          <input
            id="businessLocation"
            placeholder="Mf. Kariakoo, Dar es Salaam">

        </div>

      </div>


      <div
        id="salerFields"
        class="hidden">

        <div class="field">

          <label>
            Business Code
          </label>

          <input
            id="businessCode"
            placeholder="Code uliyopewa na Owner">

        </div>

      </div>


      <button
        class="primary"
        id="btn"
        type="submit">

        Fungua Akaunti

      </button>

    </form>

  `;

  document
    .getElementById('form')
    .addEventListener(
      'submit',
      complete
    );

}


function setRole(r){

  role = r;

  document
    .getElementById('ownerFields')
    .classList
    .toggle(
      'hidden',
      r !== 'owner'
    );

  document
    .getElementById('salerFields')
    .classList
    .toggle(
      'hidden',
      r !== 'saler'
    );

  document
    .getElementById('ownerTab')
    .classList
    .toggle(
      'active',
      r === 'owner'
    );

  document
    .getElementById('salerTab')
    .classList
    .toggle(
      'active',
      r === 'saler'
    );

}


async function complete(e){

  e.preventDefault();

  const btn =
    document.getElementById('btn');

  btn.disabled = true;

  btn.textContent =
    'Inafungua akaunti...';


  const body = {

    ticket,

    role,

    fullName:
      document
        .getElementById('fullName')
        .value
        .trim(),

    phone:
      document
        .getElementById('phone')
        .value
        .trim()

  };


  if(role === 'owner'){

    body.businessName =
      document
        .getElementById('businessName')
        .value
        .trim();

    body.businessType =
      document
        .getElementById('businessType')
        .value
        .trim();

    body.businessPhone =
      document
        .getElementById('businessPhone')
        .value
        .trim();

    body.region =
      document
        .getElementById('region')
        .value
        .trim();

    body.district =
      document
        .getElementById('district')
        .value
        .trim();

    body.ward =
      document
        .getElementById('ward')
        .value
        .trim();

    body.businessLocation =
      document
        .getElementById('businessLocation')
        .value
        .trim();

  }else{

    body.businessCode =
      document
        .getElementById('businessCode')
        .value
        .trim();

  }


  try{

    const r =
      await fetch(
        '/api/oauth/complete',
        {
          method:'POST',
          headers:{
            'Content-Type':
              'application/json'
          },
          body:
            JSON.stringify(body)
        }
      );


    const d =
      await r
        .json()
        .catch(() => ({}));


    if(!r.ok){

      throw Error(
        d.error ||
        'Imeshindikana kukamilisha account.'
      );

    }


    localStorage.setItem(
      'dp_token',
      d.token
    );


    localStorage.setItem(
      'dp_user',
      JSON.stringify(d.user)
    );


    location.replace(
      d.user.role === 'saler'
        ? '/saler.html'
        : d.user.role === 'super_admin'
          ? '/super-admin.html'
          : '/dashboard.html'
    );


  }catch(err){

    errorBox(
      err.message
    );

    btn.disabled = false;

    btn.textContent =
      'Fungua Akaunti';

  }

}


(async()=>{

  if(!ticket){

    app.innerHTML = `
      <div
        class="error"
        style="display:block">

        OAuth ticket haipo.
        Rudi kwenye login.

      </div>
    `;

    return;
  }


  try{

    const r =
      await fetch(
        '/api/oauth/ticket',
        {
          method:'POST',
          headers:{
            'Content-Type':
              'application/json'
          },
          body:
            JSON.stringify({
              ticket
            })
        }
      );


    const d =
      await r
        .json()
        .catch(() => ({}));


    if(!r.ok){

      throw Error(
        d.error ||
        'OAuth session imeisha.'
      );

    }


    if(d.token){

      localStorage.setItem(
        'dp_token',
        d.token
      );

      localStorage.setItem(
        'dp_user',
        JSON.stringify(d.user)
      );


      location.replace(
        d.user.role === 'saler'
          ? '/saler.html'
          : d.user.role === 'super_admin'
            ? '/super-admin.html'
            : '/dashboard.html'
      );

      return;

    }


    info = d;

    renderSignup();


  }catch(err){

    app.innerHTML = `

      <div
        class="error"
        style="display:block">

        ${esc(
          err.message ||
          'Imeshindikana.'
        )}

      </div>

      <p>
        <a href="/login.html">
          ← Rudi Login
        </a>
      </p>

    `;

  }

})();

</script>

</body>
</html>
