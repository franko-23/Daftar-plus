<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftari+ | Inaingia...</title>
<style>
body{font-family:Inter,system-ui,sans-serif;min-height:100vh;background:#F7FBFA;display:flex;align-items:center;justify-content:center;color:#0B1E1C}
.box{text-align:center}
.spinner{width:40px;height:40px;border:4px solid #E3FBF7;border-top-color:#00BFA6;border-radius:50%;margin:0 auto 16px;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
p{color:#5B6E6B;font-size:14px}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p id="msg">Inakamilisha kuingia...</p>
</div>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if(!token){
    document.getElementById('msg').textContent = 'Imeshindikana. Tafadhali jaribu tena.';
    setTimeout(() => location.href = '/login.html', 1500);
    return;
  }
  localStorage.setItem('dp_token', token);
  try{
    const r = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
    const data = await r.json();
    if(!r.ok || !data.user) throw new Error('me failed');
    localStorage.setItem('dp_user', JSON.stringify(data.user));
    const role = data.user.role;
    if(role === 'super_admin') location.href = '/super-admin.html';
    else if(role === 'owner') location.href = '/dashboard.html';
    else if(role === 'saler' || role === 'seller') location.href = '/saler.html';
    else location.href = '/login.html';
  }catch(e){
    localStorage.removeItem('dp_token');
    document.getElementById('msg').textContent = 'Imeshindikana kuingia. Tafadhali jaribu tena.';
    setTimeout(() => location.href = '/login.html', 1500);
  }
})();
</script>
</body>
</html>
