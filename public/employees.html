<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wafanyakazi — Daftari+</title><link rel="stylesheet" href="/css/fama-theme.css"><style>
body{margin:0;font-family:Inter,system-ui;background:var(--df-bg);color:var(--df-text)}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:21px;font-weight:800}.brand span{color:var(--df-primary)}.actions{display:flex;gap:9px}.btn{padding:10px 14px;border:1px solid var(--df-line);background:#fff;font-weight:700;cursor:pointer}.primary{background:var(--df-primary)!important;color:#fff!important}.card{padding:20px;margin-bottom:18px}.muted{color:var(--df-muted)}table{width:100%;min-width:760px;border-collapse:collapse}th,td{padding:13px 10px;border-bottom:1px solid var(--df-line);text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--df-muted)}.table{overflow:auto}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.active{background:var(--df-primary-soft);color:var(--df-primary-dark)}.suspended{background:#fff4e8;color:#a15c00}.modal{position:fixed;inset:0;background:#10201d66;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{width:min(520px,100%);padding:22px;background:#fff;border-radius:20px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid var(--df-line);box-sizing:border-box}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.row{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">Daftari<span>+</span></div><div class="muted">Usimamizi wa wafanyakazi / sellers</div></div><div class="actions"><button class="btn" onclick="location.href='/dashboard.html'">← Dashboard</button><button class="btn primary" id="add">+ Ongeza Seller</button></div></div><div class="card"><div class="top"><div><h2 style="margin:0">Wafanyakazi</h2><p class="muted">Ongeza, angalia na simamia access ya sellers wa biashara yako.</p></div><strong id="count">—</strong></div><div class="table"><table><thead><tr><th>Jina</th><th>Simu</th><th>Email</th><th>Provider</th><th>Status</th><th>Last Login</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7">Inapakia…</td></tr></tbody></table></div></div></div><div class="modal" id="modal"><div class="box"><div class="top"><h3 style="margin:0">Ongeza Seller</h3><button class="btn" id="close">×</button></div><form id="form"><div class="field"><label>Jina kamili</label><input id="name" required></div><div class="row"><div class="field"><label>Simu</label><input id="phone" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div></div><div class="field"><label>Password (angalau herufi 8)</label><input id="password" type="password" minlength="8" required></div><button class="btn primary" style="width:100%;margin-top:8px">Hifadhi Seller</button></form><p id="msg" class="muted"></p></div></div><script>
const token=localStorage.getItem('daftari_token');if(!token)location.href='/login.html';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('daftari_token');location.href='/login.html';return null}if(!r.ok)throw Error(d.error||'Hitilafu');return d}async function load(){try{const me=await api('/api/me');if(!me)return;if(me.user.role!=='owner'){location.href='/dashboard.html';return}const d=await api('/api/employees');const a=d.employees||[];$('count').textContent=a.length+' sellers';$('rows').innerHTML=a.length?a.map(u=>`<tr><td><b>${esc(u.full_name)}</b></td><td>${esc(u.phone||'—')}</td><td>${esc(u.email)}</td><td>${esc(u.provider||'email')}</td><td><span class="badge ${u.status}">${esc(u.status)}</span></td><td>${u.last_login?new Date(u.last_login).toLocaleString('sw-TZ'):'—'}</td><td><button class="btn" data-id="${u.id}" data-status="${u.status==='active'?'suspended':'active'}">${u.status==='active'?'Suspend':'Activate'}</button></td></tr>`).join(''):'<tr><td colspan="7">Hakuna seller bado.</td></tr>';$('rows').querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{try{await api('/api/employees/'+encodeURIComponent(b.dataset.id)+'/status',{method:'POST',body:JSON.stringify({status:b.dataset.status})});load()}catch(e){alert(e.message)}})}catch(e){$('rows').innerHTML=`<tr><td colspan="7">${esc(e.message)}</td></tr>`}}$('add').onclick=()=>{$('modal').classList.add('show');$('msg').textContent=''};$('close').onclick=()=>$('modal').classList.remove('show');$('form').onsubmit=async e=>{e.preventDefault();try{await api('/api/employees',{method:'POST',body:JSON.stringify({fullName:$('name').value,phone:$('phone').value,email:$('email').value,password:$('password').value})});$('form').reset();$('modal').classList.remove('show');load()}catch(x){$('msg').textContent=x.message}};load();
</script></body></html>
