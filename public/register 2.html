<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fungua Akaunti — Daftari Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#F3F4F9; --panel:#FFFFFF; --line:#E7E8F2;
    --text:#171A2B; --muted:#6B7290; --faint:#9AA1B8;
    --accent:#8B7CF6; --accent2:#6C5CE7; --good:#0FA968; --bad:#DC2626;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--page); color:var(--text); font-family:'Inter',sans-serif; line-height:1.6;}
  h1,h2{font-family:'Poppins',sans-serif; font-weight:600; margin:0; color:var(--text);}
  a{color:inherit; text-decoration:none;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 22px; border-radius:100px; font-weight:700; font-size:14.5px; border:1.5px solid transparent; cursor:pointer; font-family:'Poppins',sans-serif; width:100%;}
  .btn-primary{background:var(--text); color:#fff;}
  .btn-primary:hover{background:#000;}
  .btn-primary:disabled{opacity:.55; cursor:default;}
  .btn-outline{border:1.5px solid var(--line); background:var(--panel); color:var(--text);}

  header{padding:16px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; background:var(--panel);}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Poppins',sans-serif; font-weight:700; font-size:18px;}
  .brand .plus{color:var(--accent);}
  .brand-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(140deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand-mark svg{width:16px; height:16px; stroke:#fff; fill:none; stroke-width:1.8;}

  main{display:flex; align-items:flex-start; justify-content:center; padding:40px 20px 60px;}
  .card{width:100%; max-width:460px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:32px 28px; box-shadow:0 4px 20px rgba(20,20,50,.05);}
  .card h1{font-size:22px; margin-bottom:6px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:22px;}

  .role-toggle{display:flex; background:var(--page); border:1px solid var(--line); border-radius:100px; padding:4px; margin-bottom:22px;}
  .role-btn{flex:1; border:none; padding:10px; border-radius:100px; font-family:'Poppins',sans-serif; font-weight:600; font-size:12.5px; cursor:pointer; background:transparent; color:var(--muted);}
  .role-btn.active{background:var(--accent); color:#fff;}

  .section-label{font-size:11.5px; font-weight:700; letter-spacing:.04em; color:var(--faint); text-transform:uppercase; margin:22px 0 12px;}
  .section-label:first-of-type{margin-top:0;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px;}
  .field input{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--page); color:var(--text); font-size:14px; font-family:'Inter',sans-serif;}
  .field input:focus{outline:none; border-color:var(--accent); background:#fff;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .hint{font-size:12px; color:var(--faint); margin-top:5px;}

  #errBox{display:none; background:rgba(220,38,38,.08); border:1px solid rgba(220,38,38,.25); color:var(--bad); padding:11px 14px; border-radius:10px; font-size:13.5px; margin-bottom:16px;}
  .terms{font-size:12.5px; color:var(--faint); text-align:center; margin:16px 0;}
  .terms a{color:var(--accent);}
  .switch{text-align:center; font-size:14px; color:var(--muted); margin-top:8px;}
  .switch a{color:var(--accent); font-weight:600;}

  .success-icon{width:52px; height:52px; border-radius:50%; background:rgba(15,169,104,.1); display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
  .code-box{background:rgba(139,124,246,.08); border:1.5px dashed var(--accent); border-radius:12px; padding:20px; margin:20px 0; text-align:center;}
  .code-box .v{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; letter-spacing:.08em;}

  @media (max-width:480px){ .two-col{grid-template-columns:1fr;} .card{padding:26px 20px;} }
</style>
</head>
<body>

<header>
  <a href="/" class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></span>Daftari<span class="plus">+</span></a>
  <a href="/login.html" class="btn btn-outline" style="width:auto; padding:9px 18px; font-size:13px;">Ingia</a>
</header>

<main>

  <div class="card" id="successBox" style="display:none; text-align:center;">
    <div class="success-icon"><svg viewBox="0 0 24 24" width="26" height="26" stroke="#0FA968" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></div>
    <h1>Akaunti Imefunguliwa!</h1>
    <p class="sub" id="successMsg" style="margin-bottom:0;"></p>
    <div class="code-box" id="codeBox" style="display:none;">
      <div class="v" id="bizCodeDisplay">——</div>
    </div>
    <button class="btn btn-outline" id="copyCodeBtn" style="display:none; margin-bottom:12px;">Nakili Business Code</button>
    <button class="btn btn-primary" id="continueBtn">Endelea kwenye Dashboard →</button>
  </div>

  <div class="card" id="formBox">
    <h1>Fungua Akaunti Bure</h1>
    <p class="sub">Hauhitaji kadi ya benki — dakika 2 tu</p>

    <div class="role-toggle">
      <button type="button" class="role-btn active" data-role="owner">🏪 Fungua Duka Jipya</button>
      <button type="button" class="role-btn" data-role="saler">👤 Jiunge na Biashara</button>
    </div>

    <p id="errBox"></p>

    <form id="registerForm">
      <div class="section-label">Taarifa Zako</div>
      <div class="field"><label>Jina Kamili</label><input type="text" id="fullName" placeholder="Jina lako" required></div>
      <div class="two-col">
        <div class="field"><label>Namba ya Simu</label><input type="tel" id="phone" placeholder="07XX XXX XXX" required></div>
        <div class="field"><label>Barua Pepe</label><input type="email" id="email" placeholder="jina@mfano.com" required></div>
      </div>

      <div class="section-label">Taarifa za Biashara</div>
      <div id="ownerFields">
        <div class="field"><label>Jina la Biashara</label><input type="text" id="businessName" placeholder="mf. Duka la Amani"></div>
        <div class="field"><label>Eneo la Biashara</label><input type="text" id="businessLocation" placeholder="mf. Kariakoo, Dar es Salaam"></div>
      </div>
      <div id="salerFields" style="display:none;">
        <div class="field">
          <label>Business Code</label>
          <input type="text" id="businessCode" placeholder="mf. AB12CD3" style="text-transform:uppercase;">
          <div class="hint">Uliza mmiliki wa duka akupe msimbo huu.</div>
        </div>
      </div>

      <div class="section-label">Usalama wa Akaunti</div>
      <div class="field"><label>Nywila</label><input type="password" id="password" placeholder="Angalau herufi 10" required></div>

      <button class="btn btn-primary" type="submit" id="submitBtn" style="margin-top:6px;">Anza Bure Sasa</button>
    </form>
    <p class="terms">Kwa kujisajili, unakubali <a href="#">Vigezo vya Matumizi</a> na <a href="#">Sera ya Faragha</a></p>
    <p class="switch">Tayari una akaunti? <a href="/login.html">Ingia Hapa</a></p>
  </div>
</main>

<script>
  let currentRole = 'owner';
  const roleBtns = document.querySelectorAll('.role-btn');
  const ownerFields = document.getElementById('ownerFields');
  const salerFields = document.getElementById('salerFields');
  const errBox = document.getElementById('errBox');
  const submitBtn = document.getElementById('submitBtn');
  const formBox = document.getElementById('formBox');
  const successBox = document.getElementById('successBox');

  if (localStorage.getItem('dp_token')) window.location.href = '/dashboard.html';

  function setRole(role) {
    currentRole = role;
    roleBtns.forEach(b => b.classList.toggle('active', b.dataset.role === role));
    ownerFields.style.display = role === 'owner' ? 'block' : 'none';
    salerFields.style.display = role === 'saler' ? 'block' : 'none';
  }
  roleBtns.forEach(btn => btn.addEventListener('click', () => setRole(btn.dataset.role)));

  document.getElementById('registerForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errBox.style.display = 'none';

    // Read the role directly from whichever button is visibly active right now —
    // never trust a variable that could have gone stale.
    const activeBtn = document.querySelector('.role-btn.active');
    const roleToSend = activeBtn ? activeBtn.dataset.role : currentRole;

    if (roleToSend === 'saler' && !document.getElementById('businessCode').value.trim()) {
      errBox.textContent = 'Tafadhali weka Business Code uliyopewa na mmiliki wa duka.';
      errBox.style.display = 'block';
      return;
    }
    if (roleToSend === 'owner' && !document.getElementById('businessName').value.trim()) {
      errBox.textContent = 'Tafadhali weka jina la biashara.';
      errBox.style.display = 'block';
      return;
    }

    const payload = {
      fullName: document.getElementById('fullName').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      role: roleToSend
    };
    if (roleToSend === 'owner') {
      payload.businessName = document.getElementById('businessName').value.trim();
      payload.businessLocation = document.getElementById('businessLocation').value.trim();
    } else {
      payload.businessCode = document.getElementById('businessCode').value.trim().toUpperCase();
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Inatuma...';
    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Imeshindwa kujisajili.');

      localStorage.setItem('dp_token', data.token);
      localStorage.setItem('dp_user', JSON.stringify(data.user));

      // IMPORTANT: trust the ROLE THE SERVER ACTUALLY SAVED (data.user.role),
      // not the button the person clicked — this guarantees what's shown here
      // always matches what's really in the database.
      formBox.style.display = 'none';
      successBox.style.display = 'block';

      if (data.user.role === 'owner' && data.business && data.business.code) {
        document.getElementById('successMsg').textContent = 'Hii ndiyo Business Code ya duka lako — hifadhi, utahitaji kuwapa wafanyakazi wako ili wajiunge.';
        document.getElementById('codeBox').style.display = 'block';
        document.getElementById('copyCodeBtn').style.display = 'inline-flex';
        document.getElementById('bizCodeDisplay').textContent = data.business.code;
        document.getElementById('copyCodeBtn').addEventListener('click', () => {
          navigator.clipboard.writeText(data.business.code);
          document.getElementById('copyCodeBtn').textContent = 'Imenakiliwa ✓';
        });
      } else if (data.user.role === 'saler') {
        document.getElementById('successMsg').textContent = `Umejiunga na ${data.business ? data.business.name : 'biashara'} kama Muuzaji.`;
      } else {
        document.getElementById('successMsg').textContent = 'Akaunti yako iko tayari.';
      }

      document.getElementById('continueBtn').addEventListener('click', () => {
        window.location.href = data.user.role === 'saler' ? '/saler.html' : '/dashboard.html';
      });

    } catch (err) {
      errBox.textContent = err.message;
      errBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Anza Bure Sasa';
    }
  });
</script>

</body>
</html>
