<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftari+ | Customer Care</title>
<script>
(function(){
  try{
    var choice = localStorage.getItem('dp_theme_choice') || 'auto';
    var effective = choice;
    if(choice === 'auto'){
      var h = new Date().getHours();
      effective = (h >= 6 && h < 18) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', effective);
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00BFA6; --teal-dark:#009984; --teal-soft:#E3FBF7; --teal-deep:#00A896;
  --bg:#F7FBFA; --panel:#FFFFFF; --panel-2:#F2F6F5; --text:#0B1E1C; --text-dim:#5B6E6B; --text-faint:#8FA19E;
  --border:#E3ECEA; --amber:#F5A623; --amber-soft:#FEF3E2; --coral:#E4453A; --coral-soft:#FEF2F2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --teal:#2ED9A8; --teal-dark:#1EBE91; --teal-soft:#0F2E28; --teal-deep:#17B392;
  --bg:#0E1420; --panel:#161D2C; --panel-2:#111827; --text:#F3F5F8; --text-dim:#9AA4B7; --text-faint:#6B7488;
  --border:#2A3448; --amber:#F5A623; --amber-soft:#3A2D10; --coral:#FF6B6B; --coral-soft:#3A1414;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Poppins',sans-serif;margin:0}
button,input{font-family:inherit}

.app{display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:16px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,var(--teal),var(--teal-deep));display:flex;align-items:center;justify-content:center;color:#04231C;font-weight:800;font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:15px}

.body-row{flex:1;display:grid;grid-template-columns:320px 1fr;overflow:hidden}
@media(max-width:820px){.body-row{grid-template-columns:1fr}.list-col.hide-mobile{display:none}.thread-col.hide-mobile{display:none}}

.list-col{border-right:1px solid var(--border);background:var(--panel);overflow-y:auto}
.list-head{padding:14px 16px;font-size:12.5px;font-weight:700;color:var(--text-dim);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.conv-item{padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:11px}
.conv-item:hover{background:var(--panel-2)}
.conv-item.active{background:var(--teal-soft)}
.conv-av{width:38px;height:38px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;color:var(--text-dim)}
.conv-body{flex:1;min-width:0}
.conv-body .cn{display:flex;justify-content:space-between;gap:6px}
.conv-body .cn b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-body .cn .time{font-size:10.5px;color:var(--text-faint);flex-shrink:0}
.conv-body .last{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-body .meta{font-size:10.5px;color:var(--text-faint);margin-top:3px}
.dot-unread{width:9px;height:9px;border-radius:50%;background:var(--coral);flex-shrink:0;margin-top:5px}
.tag{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:100px;margin-top:4px;letter-spacing:.02em}
.tag.needs{background:var(--coral-soft);color:var(--coral)}
.tag.admin{background:var(--teal-soft);color:var(--teal-dark)}
.tag.bot{background:var(--panel-2);color:var(--text-faint)}
.empty{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:13px}

.thread-col{display:flex;flex-direction:column;overflow:hidden}
.thread-head{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;gap:12px}
.thread-head .back{display:none}
@media(max-width:820px){.thread-head .back{display:flex}}
.thread-head .ti b{display:block;font-size:14.5px}
.thread-head .ti span{font-size:11.5px;color:var(--text-dim)}
.thread-actions{margin-left:auto;display:flex;gap:8px}
.thread-actions button{padding:8px 13px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);font-size:12px;font-weight:600}

.thread-body{flex:1;overflow-y:auto;padding:18px 20px;background:var(--bg)}
.msg-row{display:flex;margin-bottom:12px}
.msg-row .bub{max-width:70%;padding:11px 14px;border-radius:15px;font-size:13.5px;line-height:1.55}
.msg-row.visitor{justify-content:flex-start}
.msg-row.visitor .bub{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-row.bot{justify-content:flex-start}
.msg-row.bot .bub{background:var(--panel-2);border:1px dashed var(--border);color:var(--text-dim);border-bottom-left-radius:4px}
.msg-row.admin{justify-content:flex-end}
.msg-row.admin .bub{background:var(--teal);color:#04231C;border-bottom-right-radius:4px;font-weight:500}
.msg-time{font-size:10px;color:var(--text-faint);margin-top:4px}

.thread-foot{padding:14px 20px;border-top:1px solid var(--border);background:var(--panel);display:flex;gap:10px}
.thread-foot input{flex:1;height:46px;border-radius:100px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:0 16px;font-size:14px;outline:none}
.thread-foot input:focus{border-color:var(--teal)}
.thread-foot button{width:46px;height:46px;border-radius:50%;border:none;background:var(--teal);color:#04231C;font-size:17px}

.placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:13.5px;flex-direction:column;gap:10px}
.placeholder .pi{font-size:38px}
</style>
</head>
<body>

<div class="app" id="app" style="display:none">
  <div class="topbar">
    <div class="brand"><span class="brand-mark">D+</span>Customer Care</div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="themeToggle">🌓</button>
      <a href="/dashboard.html" class="icon-btn" style="text-decoration:none">🏠</a>
    </div>
  </div>

  <div class="body-row">
    <div class="list-col" id="listCol">
      <div class="list-head"><span>Mazungumzo</span><span id="convCount">0</span></div>
      <div id="convList"><div class="empty">Inapakia...</div></div>
    </div>

    <div class="thread-col" id="threadCol">
      <div class="placeholder" id="threadPlaceholder">
        <div class="pi">💬</div>
        <div>Chagua mazungumzo upande wa kushoto</div>
      </div>

      <div id="threadActive" style="display:none;flex-direction:column;height:100%">
        <div class="thread-head">
          <button class="icon-btn back" id="backBtn">←</button>
          <div class="ti"><b id="thName">—</b><span id="thMeta">—</span></div>
          <div class="thread-actions">
            <button id="releaseBtn">Achia kwa Bot</button>
          </div>
        </div>
        <div class="thread-body" id="threadBody"></div>
        <div class="thread-foot">
          <input type="text" id="replyInput" placeholder="Andika jibu...">
          <button id="replySend">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="initLoader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8FA19E;font-family:Inter,sans-serif">Inapakia...</div>

<script>
function $(id){ return document.getElementById(id); }
function getToken(){ return localStorage.getItem('dp_token'); }

async function api(path, options={}){
  const headers = { 'Content-Type':'application/json', ...(options.headers||{}) };
  const token = getToken();
  if(token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(path, { ...options, headers });
  let d = {};
  try{ d = await r.json(); }catch{}
  if(r.status===401){ localStorage.removeItem('dp_token'); window.location.replace('/login.html'); throw new Error('Session imeisha'); }
  if(!r.ok){ throw new Error(d.error || 'Hitilafu ya server.'); }
  return d;
}

function timeAgo(iso){
  try{
    const d = new Date(iso+'Z');
    const diffMin = Math.floor((Date.now()-d.getTime())/60000);
    if(diffMin<1) return 'sasa hivi';
    if(diffMin<60) return diffMin+'m';
    const h = Math.floor(diffMin/60);
    if(h<24) return h+'h';
    return d.toLocaleDateString('sw-TZ');
  }catch(e){ return ''; }
}

let conversations = [];
let activeId = null;
let listTimer = null, threadTimer = null;

async function init(){
  const token = getToken();
  if(!token){ window.location.replace('/login.html'); return; }
  try{
    const me = await api('/api/me');
    if(me.user.role !== 'super_admin'){
      window.location.replace('/dashboard.html');
      return;
    }
  }catch(e){ return; }

  applyTheme(localStorage.getItem('dp_theme_choice') || 'auto');
  $('initLoader').style.display = 'none';
  $('app').style.display = 'flex';

  await loadConversations();
  listTimer = setInterval(loadConversations, 8000);
}

async function loadConversations(){
  try{
    const res = await api('/api/admin/chat/conversations');
    conversations = res.conversations || [];
    renderList();
  }catch(e){
    $('convList').innerHTML = '<div class="empty">Imeshindwa kupakia: '+e.message+'</div>';
  }
}

function renderList(){
  $('convCount').textContent = conversations.length;
  if(!conversations.length){
    $('convList').innerHTML = '<div class="empty">Bado hakuna mazungumzo.</div>';
    return;
  }
  $('convList').innerHTML = conversations.map(c=>{
    const initials = (c.visitor_name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const tag = c.status==='needs_human' ? '<span class="tag needs">HITAJI JIBU</span>'
      : c.status==='with_admin' ? '<span class="tag admin">UNAJIBU</span>'
      : '<span class="tag bot">BOT</span>';
    return `
      <div class="conv-item ${c.id===activeId?'active':''}" data-id="${c.id}">
        <div class="conv-av">${initials}</div>
        <div class="conv-body">
          <div class="cn"><b>${c.visitor_name}</b><span class="time">${timeAgo(c.last_message_at)}</span></div>
          <div class="last">${c.last_message || ''}</div>
          <div class="meta">${c.visitor_region} · ${c.visitor_area} · ${c.visitor_phone}</div>
          ${tag}
        </div>
        ${c.admin_unread ? '<span class="dot-unread"></span>' : ''}
      </div>
    `;
  }).join('');

  $('convList').querySelectorAll('.conv-item').forEach(el=>{
    el.addEventListener('click', ()=> openConversation(Number(el.dataset.id)));
  });
}

async function openConversation(id){
  activeId = id;
  renderList();
  $('threadPlaceholder').style.display = 'none';
  $('threadActive').style.display = 'flex';
  if(window.innerWidth <= 820){
    $('listCol').classList.add('hide-mobile');
  }
  await loadThread();
  clearInterval(threadTimer);
  threadTimer = setInterval(loadThread, 4000);
}

async function loadThread(){
  if(!activeId) return;
  try{
    const res = await api('/api/admin/chat/conversations/'+activeId+'/messages');
    const c = res.conversation;
    $('thName').textContent = c.visitor_name;
    $('thMeta').textContent = c.visitor_phone + ' · ' + c.visitor_region + ', ' + c.visitor_area;
    renderThread(res.messages || []);
  }catch(e){}
}

function renderThread(messages){
  $('threadBody').innerHTML = messages.map(m=>`
    <div class="msg-row ${m.sender}">
      <div>
        <div class="bub">${escapeHtml(m.message)}</div>
        <div class="msg-time">${timeAgo(m.created_at)}</div>
      </div>
    </div>
  `).join('');
  $('threadBody').scrollTop = $('threadBody').scrollHeight;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

$('backBtn').addEventListener('click', ()=>{
  $('listCol').classList.remove('hide-mobile');
  $('threadActive').style.display = 'none';
  $('threadPlaceholder').style.display = 'flex';
  activeId = null;
  clearInterval(threadTimer);
});

$('replySend').addEventListener('click', sendReply);
$('replyInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendReply(); });

async function sendReply(){
  const text = $('replyInput').value.trim();
  if(!text || !activeId) return;
  $('replyInput').value = '';
  try{
    await api('/api/admin/chat/conversations/'+activeId+'/reply', {
      method:'POST', body: JSON.stringify({ message:text })
    });
    await loadThread();
    await loadConversations();
  }catch(e){}
}

$('releaseBtn').addEventListener('click', async ()=>{
  if(!activeId) return;
  try{
    await api('/api/admin/chat/conversations/'+activeId+'/release', { method:'POST' });
    await loadThread();
    await loadConversations();
  }catch(e){}
});

function effectiveTheme(choice){
  if(choice!=='auto') return choice;
  const h = new Date().getHours();
  return (h>=6 && h<18) ? 'light' : 'dark';
}
function applyTheme(choice){
  document.documentElement.setAttribute('data-theme', effectiveTheme(choice));
  try{ localStorage.setItem('dp_theme_choice', choice); }catch(e){}
}
$('themeToggle').addEventListener('click', ()=>{
  const cur = localStorage.getItem('dp_theme_choice') || 'auto';
  const next = cur==='dark' ? 'light' : cur==='light' ? 'auto' : 'dark';
  applyTheme(next);
});

init();
</script>
</body>
</html>
