<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hakiki Bili | Daftari+</title>
<style>
:root{--teal:#00BFA6;--teal-dark:#009984;--teal-soft:#E3FBF7;--bg:#F7FBFA;--panel:#fff;--text:#0B1E1C;--dim:#5B6E6B;--border:#E3ECEA;--coral:#E4453A;--coral-soft:#FEF2F2}
@media (prefers-color-scheme:dark){:root{--teal:#2ED9A8;--teal-dark:#1EBE91;--teal-soft:#0F2E28;--bg:#0E1420;--panel:#161D2C;--text:#F3F5F8;--dim:#9AA4B7;--border:#2A3448;--coral:#FF6B6B;--coral-soft:#3A1414}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:440px;margin:0 auto;padding:22px 16px 40px}
.badge{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;font-weight:700;font-size:15px;margin-bottom:16px}
.badge.ok{background:var(--teal-soft);color:var(--teal-dark)}
.badge.bad{background:var(--coral-soft);color:var(--coral)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px}
h1{margin:0;font-size:19px;text-align:center}
.meta{text-align:center;font-size:12.5px;color:var(--dim);margin:4px 0}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:14px}
.line small{display:block;color:var(--dim);font-size:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-top:14px}
.lipa{margin-top:16px;padding:14px;border-radius:14px;background:var(--teal-soft);text-align:center}
.lipa .k{font-size:12px;color:var(--dim)}
.lipa .v{font-size:26px;font-weight:800;color:var(--teal-dark);letter-spacing:1px}
.warn{font-size:12.5px;color:var(--dim);text-align:center;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="meta">Inahakiki bili...</div></div>
<script>
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tzs(n){return 'TZS '+Math.round(n||0).toLocaleString('en-US')}
var root=document.getElementById('root');
var code=(new URLSearchParams(location.search).get('c')||'').trim();

function bad(msg){
  root.innerHTML='<div class="badge bad">✕ Bili haijathibitishwa</div><div class="card"><p style="margin:0;text-align:center">'+esc(msg)+'</p></div>'+
  '<p class="warn">Usilipe kwa bili hii. Wasiliana na duka moja kwa moja kuthibitisha.</p>';
}

if(!code){ bad('Code ya bili haipo.'); }
else{
  fetch('/api/bills/verify/'+encodeURIComponent(code)).then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d}})}).then(function(x){
    if(!x.ok||!x.d.valid){ bad(x.d.error||'Bili hii haijapatikana kwenye mfumo.'); return; }
    var b=x.d.bill;
    var when=new Date(String(b.created_at).replace(' ','T')+'Z').toLocaleString('sw-TZ');
    root.innerHTML=
      '<div class="badge ok">✓ Bili Halali — imetolewa na '+esc(b.shop)+'</div>'+
      '<div class="card">'+
        '<h1>'+esc(b.shop)+'</h1>'+
        '<div class="meta">BILI '+esc(b.code)+' · '+esc(when)+'</div>'+
        (b.customer?'<div class="meta">Mteja: '+esc(b.customer)+'</div>':'')+
        '<div style="margin-top:12px">'+
        b.items.map(function(i){return '<div class="line"><span>'+esc(i.name)+'<small>'+i.qty+' × '+tzs(i.price)+'</small></span><span class="mono">'+tzs(i.line)+'</span></div>'}).join('')+
        '</div>'+
        '<div class="total"><span>Jumla</span><span class="mono">'+tzs(b.total)+'</span></div>'+
        '<div class="lipa"><div class="k">LIPA NAMBA'+(b.lipa_jina?' · '+esc(b.lipa_jina):'')+'</div><div class="v mono">'+esc(b.lipa_namba)+'</div></div>'+
      '</div>'+
      '<p class="warn">Hakikisha Lipa Namba na jina la mpokeaji vinalingana na hapa kabla ya kulipa.<br>Muuzaji: '+esc(b.seller)+'</p>';
  }).catch(function(){ bad('Imeshindwa kuwasiliana na server. Jaribu tena.'); });
}
</script>
</body>
</html>
