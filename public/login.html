<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingia — Daftari Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#181254; --bg-2:#241D6B; --panel:#231C5E; --panel-brd:#3A2F8C;
    --text:#F3F1FF; --text-dim:#B9B3E0; --text-faint:#867FB8;
    --purple:#8B7CF6; --purple-2:#6C5CE7; --mint:#3DDC97; --amber:#F5B948;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(1200px 700px at 20% -10%, #2C2380 0%, var(--bg-1) 55%) fixed, var(--bg-1);
    color:var(--text); font-family:'Inter',sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  h1,h2{font-family:'Poppins',sans-serif; font-weight:600; margin:0; color:var(--text); letter-spacing:-0.01em;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1140px; margin:0 auto; padding:0 24px; width:100%;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border-radius:100px; font-weight:700; font-size:14px; border:1.5px solid transparent; cursor:pointer; font-family:'Poppins',sans-serif; white-space:nowrap;}
  .btn-white{background:var(--text); color:#181254;}
  .btn-white:hover{background:#fff;}
  .btn-outline{border-color:rgba(243,241,255,.25); color:var(--text); background:rgba(255,255,255,.04);}

  header{padding:18px 0; border-bottom:1px solid rgba(255,255,255,.08);}
  nav{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:11px; font-family:'Poppins',sans-serif; font-weight:600; font-size:20px;}
  .brand .plus{color:var(--purple);}
  .brand-mark{width:38px; height:38px; border-radius:11px; background:linear-gradient(140deg,var(--purple),var(--purple-2)); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand-mark svg{width:19px; height:19px; stroke:#fff; fill:none; stroke-width:1.8;}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:60px 24px;}
  .auth-card{
    width:100%; max-width:420px; background:var(--panel); border:1px solid var(--panel-brd);
    border-radius:20px; padding:36px 32px; box-shadow:0 40px 100px -30px rgba(10,6,50,.6);
  }
  .auth-card h1{font-size:24px; margin-bottom:8px; text-align:center;}
  .auth-card .sub{color:var(--text-dim); font-size:14px; text-align:center; margin-bottom:28px;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:8px;}
  .field input{
    width:100%; padding:13px 15px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04); color:var(--text); font-size:14.5px; font-family:'Inter',sans-serif;
  }
  .field input::placeholder{color:var(--text-faint);}
  .field input:focus{outline:none; border-color:var(--purple);}
  .row-between{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; font-size:13.5px;}
  .row-between a{color:var(--purple); font-weight:600;}
  .auth-card .btn{width:100%; padding:13px; font-size:14.5px; margin-bottom:20px;}
  .switch{text-align:center; font-size:14px; color:var(--text-dim);}
  .switch a{color:var(--purple); font-weight:600;}

  footer{padding:26px 0; text-align:center; color:var(--text-faint); font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <a href="/" class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></span>Daftari<span class="plus">+</span></a>
      <a href="/register.html" class="btn btn-outline" style="padding:9px 18px; font-size:13px;">Fungua Akaunti</a>
    </nav>
  </div>
</header>

<main>
  <div class="auth-card">
    <h1>Karibu Tena</h1>
    <p class="sub">Ingia kwenye akaunti yako ya Daftari Plus</p>
    <p id="errBox" style="display:none; background:rgba(242,107,107,.12); border:1px solid rgba(242,107,107,.3); color:#F26B6B; padding:11px 14px; border-radius:10px; font-size:13.5px; margin-bottom:16px;"></p>
    <form id="loginForm">
      <div class="field">
        <label>Barua Pepe</label>
        <input type="email" id="email" placeholder="jina@biashara.com" required>
      </div>
      <div class="field">
        <label>Nywila</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div class="row-between">
        <label style="display:flex; align-items:center; gap:8px; color:var(--text-dim);"><input type="checkbox" style="accent-color:var(--purple);">Nikumbuke</label>
        <a href="#">Umesahau nywila?</a>
      </div>
      <button class="btn btn-white" type="submit" id="submitBtn">Ingia</button>
    </form>
    <p class="switch">Huna akaunti? <a href="/register.html">Fungua Akaunti Bure</a></p>
  </div>
</main>

<footer>© 2026 Daftari Plus. Haki zote zimehifadhiwa.</footer>

<script>
  const errBox = document.getElementById('errBox');
  const submitBtn = document.getElementById('submitBtn');

  // If already logged in, skip straight to dashboard
  if (localStorage.getItem('dp_token')) {
    window.location.href = '/dashboard.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Inaingia...';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Imeshindwa kuingia.');
      localStorage.setItem('dp_token', data.token);
      localStorage.setItem('dp_user', JSON.stringify(data.user));
      window.location.href = '/dashboard.html';
    } catch (err) {
      errBox.textContent = err.message;
      errBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Ingia';
    }
  });
</script>

</body>
</html>
