<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftari+ | Login</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      min-height:100vh;
      background:#f5f7fb;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      color:#171a2d;
    }

    .login-container{
      width:100%;
      max-width:430px;
    }

    .login-card{
      background:#fff;
      border:1px solid #e7e9f0;
      border-radius:22px;
      padding:34px;
      box-shadow:0 18px 50px rgba(22,30,60,.08);
    }

    .logo{
      text-align:center;
      font-size:32px;
      font-weight:900;
      color:#171a2d;
      margin-bottom:6px;
      letter-spacing:-1px;
    }

    .logo span{
      color:#5b5ce2;
    }

    .subtitle{
      text-align:center;
      color:#737a91;
      font-size:14px;
      margin-bottom:28px;
    }

    .error-box{
      display:none;
      background:#fff1f2;
      border:1px solid #ffd3d8;
      color:#c5303d;
      padding:12px 14px;
      border-radius:11px;
      font-size:13px;
      margin-bottom:18px;
      line-height:1.5;
    }

    .form-group{
      margin-bottom:17px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:800;
      margin-bottom:7px;
      color:#30364d;
    }

    input{
      width:100%;
      height:48px;
      border:1px solid #dfe3ec;
      border-radius:11px;
      padding:0 14px;
      font-size:15px;
      color:#171a2d;
      outline:none;
      background:#fff;
      transition:.2s;
    }

    input:focus{
      border-color:#5b5ce2;
      box-shadow:0 0 0 3px rgba(91,92,226,.10);
    }

    input::placeholder{
      color:#a0a6b7;
    }

    .remember{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:19px;
      font-size:13px;
      color:#737a91;
      cursor:pointer;
    }

    .remember input{
      width:16px;
      height:16px;
      margin:0;
    }

    .login-btn{
      width:100%;
      height:49px;
      border:0;
      border-radius:11px;
      background:#5b5ce2;
      color:#fff;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
      transition:.2s;
    }

    .login-btn:hover{
      background:#4e4fd1;
    }

    .login-btn:disabled{
      opacity:.65;
      cursor:not-allowed;
    }

    .bottom-text{
      text-align:center;
      margin-top:22px;
      font-size:13px;
      color:#737a91;
    }

    .bottom-text a{
      color:#5b5ce2;
      text-decoration:none;
      font-weight:800;
    }

    .bottom-text a:hover{
      text-decoration:underline;
    }

    .loading-screen{
      position:fixed;
      inset:0;
      background:#f5f7fb;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }

    .loading-box{
      text-align:center;
      color:#555c72;
      font-size:14px;
    }

    .spinner{
      width:38px;
      height:38px;
      border:4px solid #e4e6ef;
      border-top-color:#5b5ce2;
      border-radius:50%;
      animation:spin .8s linear infinite;
      margin:0 auto 14px;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    @media(max-width:480px){
      body{
        padding:14px;
      }

      .login-card{
        padding:26px 20px;
        border-radius:18px;
      }

      .logo{
        font-size:29px;
      }
    }
  </style>
</head>

<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-box">
    <div class="spinner"></div>
    <div>Inaangalia session yako...</div>
  </div>
</div>

<div class="login-container">

  <div class="login-card">

    <div class="logo">
      Daftari<span>+</span>
    </div>

    <div class="subtitle">
      Ingia kwenye akaunti yako
    </div>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Barua Pepe</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Weka barua pepe yako"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Nywila</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Weka nywila yako"
          autocomplete="current-password"
          required
        >
      </div>

      <label class="remember">
        <input type="checkbox" id="remember">
        <span>Nikumbuke</span>
      </label>

      <button
        type="submit"
        class="login-btn"
        id="loginButton">
        Ingia
      </button>

    </form>

    <div class="bottom-text">
      Huna akaunti?
      <a href="/register.html">Fungua Akaunti</a>
    </div>

  </div>

</div>

<script>

const loginForm = document.getElementById('loginForm');
const loginButton = document.getElementById('loginButton');
const errorBox = document.getElementById('errorBox');
const loadingScreen = document.getElementById('loadingScreen');

function showError(message){
  errorBox.textContent = message || 'Kuna tatizo. Tafadhali jaribu tena.';
  errorBox.style.display = 'block';
}

function hideError(){
  errorBox.textContent = '';
  errorBox.style.display = 'none';
}

function showLoading(){
  loadingScreen.style.display = 'flex';
}

function hideLoading(){
  loadingScreen.style.display = 'none';
}

function clearSession(){
  localStorage.removeItem('dp_token');
  localStorage.removeItem('dp_user');
}

function saveUser(user){
  localStorage.setItem('dp_user', JSON.stringify(user));
}

function getToken(){
  return localStorage.getItem('dp_token');
}

/*
====================================================
USER REDIRECTION
====================================================
*/

function redirectUser(user, subscription){

  if(!user || !user.role){
    clearSession();
    window.location.replace('/login.html');
    return;
  }

  /*
  SUPER ADMIN
  */

  if(user.role === 'super_admin'){
    window.location.replace('/super-admin.html');
    return;
  }

  /*
  SELLER
  */

  if(user.role === 'saler'){
    window.location.replace('/saler.html');
    return;
  }

  /*
  BUSINESS OWNER / BUSINESS USER
  */

  if(
    subscription &&
    subscription.active === true &&
    subscription.status === 'ACTIVE'
  ){
    window.location.replace('/dashboard.html');
    return;
  }

  /*
  NO SUBSCRIPTION / EXPIRED
  */

  window.location.replace('/subscription/subscription.html');
}

/*
====================================================
API REQUEST
====================================================
*/

async function apiRequest(url, options = {}){

  const token = getToken();

  const headers = {
    'Accept':'application/json',
    ...(options.body ? {
      'Content-Type':'application/json'
    } : {}),
    ...(token ? {
      'Authorization':'Bearer ' + token
    } : {}),
    ...(options.headers || {})
  };

  const response = await fetch(url,{
    ...options,
    headers:headers,
    cache:'no-store'
  });

  let data = {};

  try{
    data = await response.json();
  }catch(error){
    data = {};
  }

  return {
    response,
    data
  };
}

/*
====================================================
GET CURRENT USER
====================================================
*/

async function getCurrentUser(){

  const token = getToken();

  if(!token){
    return null;
  }

  try{

    const result = await apiRequest(
      '/api/me',
      {
        method:'GET'
      }
    );

    const response = result.response;
    const data = result.data;

    if(response.status === 401){
      clearSession();
      return null;
    }

    if(!response.ok){
      console.error(
        'API ME ERROR:',
        response.status,
        data
      );

      return null;
    }

    if(!data || !data.user){
      return null;
    }

    return data;

  }catch(error){

    console.error(
      'GET CURRENT USER ERROR:',
      error
    );

    return null;
  }
}

/*
====================================================
CHECK EXISTING SESSION
====================================================
*/

async function checkExistingSession(){

  const token = getToken();

  if(!token){
    hideLoading();
    return;
  }

  showLoading();

  try{

    const data = await getCurrentUser();

    if(!data){

      clearSession();
      hideLoading();
      return;
    }

    saveUser(data.user);

    redirectUser(
      data.user,
      data.subscription
    );

  }catch(error){

    console.error(
      'CHECK SESSION ERROR:',
      error
    );

    clearSession();
    hideLoading();
  }
}

/*
====================================================
LOGIN
====================================================
*/

loginForm.addEventListener(
  'submit',
  async function(event){

    event.preventDefault();

    hideError();

    const email =
      document.getElementById('email')
      .value
      .trim();

    const password =
      document.getElementById('password')
      .value;

    const remember =
      document.getElementById('remember')
      .checked;

    if(!email){

      showError(
        'Tafadhali weka barua pepe.'
      );

      return;
    }

    if(!password){

      showError(
        'Tafadhali weka nywila.'
      );

      return;
    }

    loginButton.disabled = true;
    loginButton.textContent = 'Inaingia...';

    try{

      /*
      LOGIN
      */

      const result = await apiRequest(
        '/api/login',
        {
          method:'POST',

          body:JSON.stringify({
            email:email,
            password:password
          })
        }
      );

      const response = result.response;
      const data = result.data;

      /*
      LOGIN FAILED
      */

      if(!response.ok){

        clearSession();

        throw new Error(
          data.error ||
          'Email au password si sahihi.'
        );
      }

      /*
      TOKEN
      */

      if(!data.token){

        clearSession();

        throw new Error(
          'Server haikutoa login token.'
        );
      }

      /*
      USER
      */

      if(!data.user){

        clearSession();

        throw new Error(
          'Taarifa za user hazijapatikana.'
        );
      }

      /*
      SAVE TOKEN
      */

      localStorage.setItem(
        'dp_token',
        data.token
      );

      /*
      SAVE USER
      */

      saveUser(data.user);

      /*
      REMEMBER
      */

      if(remember){

        localStorage.setItem(
          'dp_remember',
          'true'
        );

      }else{

        localStorage.removeItem(
          'dp_remember'
        );
      }

      /*
      GET /api/me
      */

      const me =
        await getCurrentUser();

      if(!me){

        clearSession();

        throw new Error(
          'Login imefanyika lakini session haijathibitishwa. Jaribu tena.'
        );
      }

      /*
      SAVE UPDATED USER
      */

      saveUser(me.user);

      /*
      FINAL REDIRECT
      */

      redirectUser(
        me.user,
        me.subscription
      );

    }catch(error){

      console.error(
        'LOGIN ERROR:',
        error
      );

      showError(
        error.message ||
        'Imeshindwa kuingia. Tafadhali jaribu tena.'
      );

      loginButton.disabled = false;
      loginButton.textContent = 'Ingia';
    }
  }
);

/*
====================================================
START
====================================================
*/

document.addEventListener(
  'DOMContentLoaded',
  function(){

    checkExistingSession();

  }
);

</script>

</body>
</html>
