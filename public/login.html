<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingia — Daftari+</title>

<style>
:root{
  --bg:#f4f7f6;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#10b981;
  --accent2:#059669;
  --danger:#dc2626;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#f7faf9,#eef4f2);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

a{
  text-decoration:none;
  color:inherit;
}

.page{
  width:100%;
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding:18px 20px 28px;
  display:flex;
  flex-direction:column;
}

.top{
  display:flex;
  justify-content:flex-end;
}

.lang{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
  font-weight:700;
}

.logo{
  width:68px;
  height:68px;
  border-radius:19px;
  margin:54px auto 20px;
  background:linear-gradient(145deg,#10b981,#047857);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:800;
  font-size:25px;
  box-shadow:0 14px 30px rgba(5,150,105,.2);
}

h1{
  text-align:center;
  font-size:30px;
  margin:0 0 7px;
  font-weight:800;
  letter-spacing:-.7px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin:0 auto 28px;
  max-width:340px;
}

.social,
.emailBtn{
  width:100%;
  height:54px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(15,23,42,.035);
  transition:.18s;
}

.social:hover,
.emailBtn:hover{
  transform:translateY(-1px);
  border-color:#d1d5db;
}

.social+.social{
  margin-top:12px;
}

.apple{
  font-size:23px;
  line-height:1;
}

.googleIcon{
  font-size:20px;
  font-weight:900;
  background:conic-gradient(
    from -45deg,
    #4285f4 0 25%,
    #34a853 0 50%,
    #fbbc05 0 75%,
    #ea4335 0
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:23px 0;
  color:#9ca3af;
  font-size:12px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:var(--line);
  flex:1;
}

#emailPanel{
  display:none;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input{
  width:100%;
  height:52px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  padding:0 14px;
  font-size:15px;
  outline:none;
}

.field input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(16,185,129,.1);
}

.primary{
  width:100%;
  height:52px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.primary:disabled{
  opacity:.6;
}

.backSocial{
  border:0;
  background:transparent;
  color:var(--accent2);
  font-weight:700;
  margin:12px auto 0;
  display:block;
  cursor:pointer;
}

.error{
  display:none;
  background:#fef2f2;
  color:var(--danger);
  border:1px solid #fecaca;
  border-radius:12px;
  padding:11px 13px;
  font-size:13px;
  margin-bottom:14px;
}

.register{
  text-align:center;
  margin-top:25px;
  color:var(--muted);
  font-size:14px;
}

.register a{
  color:var(--accent2);
  font-weight:800;
}

.security{
  text-align:center;
  margin-top:auto;
  padding-top:34px;
  color:#7b8794;
  font-size:12px;
  line-height:1.55;
}

.help{
  text-align:center;
  margin-top:10px;
  color:var(--accent2);
  font-weight:700;
  font-size:13px;
}

@media(max-width:380px){

  .page{
    padding-left:15px;
    padding-right:15px;
  }

  .logo{
    margin-top:35px;
  }

  h1{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="lang">🇹🇿 SW</div>
  </div>

  <div class="logo">D+</div>

  <h1>Karibu Daftari+</h1>

  <p class="subtitle">
    Simamia mauzo, stock na biashara yako popote ulipo.
  </p>

  <div id="error" class="error"></div>

  <!-- SOCIAL LOGIN -->
  <div id="socialPanel">

    <button
      class="social"
      type="button"
      onclick="socialLogin('google')"
    >
      <span class="googleIcon">G</span>
      <span>Endelea na Google</span>
    </button>

    <button
      class="social"
      type="button"
      onclick="socialLogin('apple')"
    >
      <span class="apple"></span>
      <span>Endelea na Apple</span>
    </button>

    <div class="divider">
      au
    </div>

    <button
      class="emailBtn"
      type="button"
      onclick="showEmail()"
    >
      <span>✉</span>
      <span>Endelea kwa Email</span>
    </button>

  </div>

  <!-- EMAIL LOGIN -->
  <div id="emailPanel">

    <form id="loginForm">

      <div class="field">
        <label>Barua pepe</label>

        <input
          id="email"
          type="email"
          placeholder="jina@biashara.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label>Nywila</label>

        <input
          id="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        class="primary"
        id="submitBtn"
        type="submit"
      >
        Ingia
      </button>

    </form>

    <button
      class="backSocial"
      type="button"
      onclick="showSocial()"
    >
      ← Rudi kwenye njia za kuingia
    </button>

  </div>

  <div class="register">
    Huna akaunti?
    <a href="/register.html">Fungua Akaunti</a>
  </div>

  <div class="security">
    🛡️ Taarifa za biashara yako ziko salama na faragha.
  </div>

  <div class="help">
    Unahitaji msaada?
  </div>

</div>

<script>

const errorBox = document.getElementById('error');
const submitBtn = document.getElementById('submitBtn');


function showError(message){

  errorBox.textContent = message;
  errorBox.style.display = 'block';

}


function clearError(){

  errorBox.textContent = '';
  errorBox.style.display = 'none';

}


function showEmail(){

  clearError();

  document.getElementById('socialPanel').style.display = 'none';

  document.getElementById('emailPanel').style.display = 'block';

  document.getElementById('email').focus();

}


function showSocial(){

  clearError();

  document.getElementById('emailPanel').style.display = 'none';

  document.getElementById('socialPanel').style.display = 'block';

}


/*
  GOOGLE / APPLE LOGIN

  Backend endpoints:

  /api/auth/google/start
  /api/auth/apple/start
*/

function socialLogin(provider){

  clearError();

  if(provider !== 'google' && provider !== 'apple'){

    showError('Njia hii ya kuingia haijatambuliwa.');

    return;
  }

  window.location.href =
    '/api/auth/' + provider + '/start';

}


/*
  REDIRECT USER KULINGANA NA ROLE
*/

function redirectUser(user){

  if(!user || !user.role){

    localStorage.removeItem('dp_token');

    localStorage.removeItem('dp_user');

    window.location.replace('/login.html');

    return;
  }


  if(user.role === 'super_admin'){

    window.location.replace('/super-admin.html');

    return;
  }


  if(user.role === 'owner'){

    window.location.replace('/dashboard.html');

    return;
  }


  if(
    user.role === 'saler' ||
    user.role === 'seller'
  ){

    window.location.replace('/saler.html');

    return;
  }


  localStorage.removeItem('dp_token');

  localStorage.removeItem('dp_user');

  window.location.replace('/login.html');

}


/*
  CHECK EXISTING LOGIN
*/

if(localStorage.getItem('dp_token')){

  try{

    redirectUser(
      JSON.parse(
        localStorage.getItem('dp_user') || 'null'
      )
    );

  }catch(error){

    localStorage.removeItem('dp_token');

    localStorage.removeItem('dp_user');

  }

}


/*
  OAUTH ERROR
*/

const params =
  new URLSearchParams(location.search);

if(params.get('oauth') === 'error'){

  showError(
    params.get('message') ||
    'Imeshindikana kuingia kwa account.'
  );

  history.replaceState(
    {},
    '',
    location.pathname
  );

}


/*
  EMAIL LOGIN
*/

document
  .getElementById('loginForm')
  .addEventListener('submit', async function(e){

    e.preventDefault();

    clearError();

    submitBtn.disabled = true;

    submitBtn.textContent = 'Inaingia...';


    try{

      const response = await fetch(
        '/api/login',
        {
          method:'POST',

          headers:{
            'Content-Type':'application/json'
          },

          body:JSON.stringify({

            email:
              document
                .getElementById('email')
                .value
                .trim(),

            password:
              document
                .getElementById('password')
                .value

          })

        }
      );


      const data =
        await response
          .json()
          .catch(() => ({}));


      if(!response.ok){

        throw new Error(
          data.error ||
          'Imeshindwa kuingia.'
        );

      }


      localStorage.setItem(
        'dp_token',
        data.token
      );


      localStorage.setItem(
        'dp_user',
        JSON.stringify(data.user)
      );


      redirectUser(data.user);


    }catch(error){

      showError(
        error.message ||
        'Imeshindikana kuingia.'
      );


      submitBtn.disabled = false;

      submitBtn.textContent = 'Ingia';

    }

  });

</script>

</body>
</html>
