<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingia — Daftari Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#F3F4F9; --panel:#FFFFFF; --line:#E7E8F2;
    --text:#171A2B; --muted:#6B7290; --faint:#9AA1B8;
    --accent:#8B7CF6; --accent2:#6C5CE7; --bad:#DC2626;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--page); color:var(--text); font-family:'Inter',sans-serif; line-height:1.6;}
  h1{font-family:'Poppins',sans-serif; font-weight:600; margin:0; color:var(--text);}
  a{color:inherit; text-decoration:none;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 22px; border-radius:100px; font-weight:700; font-size:14.5px; border:1.5px solid transparent; cursor:pointer; font-family:'Poppins',sans-serif; width:100%;}
  .btn-primary{background:var(--text); color:#fff;}
  .btn-primary:hover{background:#000;}
  .btn-primary:disabled{opacity:.55; cursor:default;}
  .btn-outline{border:1.5px solid var(--line); background:var(--panel); color:var(--text);}

  header{padding:16px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; background:var(--panel);}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Poppins',sans-serif; font-weight:700; font-size:18px;}
  .brand .plus{color:var(--accent);}
  .brand-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(140deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand-mark svg{width:16px; height:16px; stroke:#fff; fill:none; stroke-width:1.8;}

  main{display:flex; align-items:center; justify-content:center; padding:60px 20px;}
  .card{width:100%; max-width:400px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:32px 28px; box-shadow:0 4px 20px rgba(20,20,50,.05);}
  .card h1{font-size:22px; margin-bottom:6px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:24px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px;}
  .input-wrap{position:relative;}
  .input-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--faint); fill:none; stroke-width:1.8;}
  .field input{width:100%; padding:12px 14px 12px 40px; border-radius:10px; border:1px solid var(--line); background:var(--page); color:var(--text); font-size:14px; font-family:'Inter',sans-serif;}
  .field input:focus{outline:none; border-color:var(--accent); background:#fff;}
  .row-between{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; font-size:13.5px;}
  .row-between label{display:flex; align-items:center; gap:8px; color:var(--muted); cursor:pointer;}
  .row-between a{color:var(--accent); font-weight:600;}

  #errBox{display:none; background:rgba(220,38,38,.08); border:1px solid rgba(220,38,38,.25); color:var(--bad); padding:11px 14px; border-radius:10px; font-size:13.5px; margin-bottom:16px;}
  .switch{text-align:center; font-size:14px; color:var(--muted); margin-top:20px;}
  .switch a{color:var(--accent); font-weight:600;}
</style>
</head>
<body>

<header>
  <a href="/" class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></span>Daftari<span class="plus">+</span></a>
  <a href="/register.html" class="btn btn-primary" style="width:auto; padding:9px 18px; font-size:13px;">Anza Bure</a>
</header>

<main>
  <div class="card">
    <h1>Karibu Tena</h1>
    <p class="sub">Ingia kwenye akaunti yako kuendelea</p>

    <p id="errBox"></p>

    <form id="loginForm">
      <div class="field">
        <label>Barua Pepe</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M4 6l8 7 8-7"/></svg>
          <input type="email" id="email" placeholder="jina@biashara.com" required>
        </div>
      </div>
      <div class="field">
        <label>Nywila</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>
      <div class="row-between">
        <label><input type="checkbox" style="accent-color:var(--accent);">Nikumbuke</label>
        <a href="#">Umesahau nywila?</a>
      </div>
      <button class="btn btn-primary" type="submit" id="submitBtn">Ingia</button>
    </form>

    <p class="switch">Huna akaunti? <a href="/register.html">Fungua Akaunti Bure</a></p>
  </div>
</main>

<script>
  const errBox = document.getElementById('errBox');
  const submitBtn = document.getElementById('submitBtn');

  if (localStorage.getItem('dp_token')) {
    const storedUser = JSON.parse(localStorage.getItem('dp_user') || 'null');
    window.location.href = storedUser && storedUser.role === 'saler' ? '/saler.html' : (storedUser && storedUser.role === 'super_admin' ? '/super-admin.html' : '/dashboard.html');
  }

  document.getElementById('loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Inaingia...';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Imeshindwa kuingia.');
      localStorage.setItem('dp_token', data.token);
      localStorage.setItem('dp_user', JSON.stringify(data.user));
      window.location.href = data.user.role === 'saler' ? '/saler.html' : (data.user.role === 'super_admin' ? '/super-admin.html' : '/dashboard.html');
    } catch (err) {
      errBox.textContent = err.message;
      errBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Ingia';
    }
  });
</script>

</body>
</html>
