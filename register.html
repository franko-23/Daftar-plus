<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jisajili | Daftari Plus</title>
<meta name="description" content="Jisajili Daftari Plus kwa email na password ili uanze kufuatilia mauzo na bidhaa za biashara yako.">
<meta name="theme-color" content="#00274d">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">D+</span>
      <span class="brand-name">Daftari <span>Plus</span></span>
    </a>
    <nav class="main-nav" aria-label="Main">
      <ul>
        <li><a href="index.html">Nyumbani</a></li>
        <li><a href="index.html#vipengele">Vipengele</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <a class="btn btn-ghost btn-sm" href="login.html">Ingia</a>
    </div>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Fungua akaunti</h1>
      <p class="auth-sub">Jisajili kwa email na password ili uanze kutumia Daftari Plus.</p>

      <div class="form-msg" id="formMsg"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="fullName">Jina kamili</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="businessName">Jina la biashara (hiari)</label>
          <input type="text" id="businessName" name="businessName" autocomplete="organization">
        </div>

        <div class="field">
          <label>Aina ya Akaunti</label>
          <div class="role-select">
            <label class="role-option">
              <input type="radio" name="role" value="admin">
              <span>Admin<small>Anaona faida, madeni, matumizi, anasimamia stock</small></span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="saler" checked>
              <span>Muuzaji (Saler)<small>Anauza bidhaa, anaweka matumizi na madeni</small></span>
            </label>
          </div>
        </div>

        <div class="field">
          <label for="email">Barua pepe (Email)</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="pw-toggle" id="pwToggle1">ONYESHA</button>
          </div>
          <div class="pw-strength" id="pwStrength">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </div>
          <p class="hint">Angalau herufi 8, changanya namba na herufi kubwa.</p>
        </div>

        <div class="field">
          <label for="confirmPassword">Thibitisha Password</label>
          <div class="pw-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" id="pwToggle2">ONYESHA</button>
          </div>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">Nakubali <a href="#">Masharti ya Matumizi</a> na <a href="#">Sera ya Faragha</a> ya Daftari Plus.</label>
        </div>

        <button type="submit" class="btn btn-amber btn-block">Jisajili</button>
      </form>

      <p class="auth-footer">Una akaunti tayari? <a href="login.html">Ingia hapa</a></p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© 2026 Daftari Plus</p>
    <ul class="footer-links">
      <li><a href="login.html">Ingia</a></li>
      <li><a href="index.html">Nyumbani</a></li>
    </ul>
  </div>
</footer>

<script>
function togglePw(inputId, btn){
  const input = document.getElementById(inputId);
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.textContent = showing ? 'ONYESHA' : 'FICHA';
}
document.getElementById('pwToggle1').addEventListener('click', function(){ togglePw('password', this); });
document.getElementById('pwToggle2').addEventListener('click', function(){ togglePw('confirmPassword', this); });

function passwordScore(pw){
  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  return score;
}
const pwInput = document.getElementById('password');
const bars = document.querySelectorAll('#pwStrength .bar');
const colors = ['#E3E6EC', '#B23A3A', '#F2A93B', '#1F9D6E', '#00274D'];
pwInput.addEventListener('input', function(){
  const score = passwordScore(pwInput.value);
  bars.forEach((bar, i) => {
    bar.style.background = i < score ? colors[score] : '#E3E6EC';
  });
});

document.getElementById('registerForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const msg = document.getElementById('formMsg');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirmPassword').value;
  const terms = document.getElementById('terms').checked;

  msg.className = 'form-msg';
  msg.textContent = '';

  if (!email || !password || !confirm) {
    msg.className = 'form-msg error';
    msg.textContent = 'Tafadhali jaza email na password.';
    return;
  }
  if (password.length < 8) {
    msg.className = 'form-msg error';
    msg.textContent = 'Password lazima iwe na angalau herufi 8.';
    return;
  }
  if (password !== confirm) {
    msg.className = 'form-msg error';
    msg.textContent = 'Password hazifanani. Jaribu tena.';
    return;
  }
  if (!terms) {
    msg.className = 'form-msg error';
    msg.textContent = 'Tafadhali kubali Masharti ya Matumizi kuendelea.';
    return;
  }

  const submitBtn = document.querySelector('#registerForm button[type="submit"]');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Inasajili...';

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fullName: document.getElementById('fullName').value.trim(),
        businessName: document.getElementById('businessName').value.trim(),
        email, password,
        role: document.querySelector('input[name="role"]:checked').value
      })
    });
    const data = await res.json();

    if (!res.ok) {
      msg.className = 'form-msg error';
      msg.textContent = data.error || 'Usajili umeshindikana. Jaribu tena.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Jisajili';
      return;
    }

    localStorage.setItem('daftari_token', data.token);
    localStorage.setItem('daftari_user', JSON.stringify(data.user));

    msg.className = 'form-msg success';
    msg.textContent = 'Umesajiliwa! Unaelekezwa...';
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
  } catch (err) {
    msg.className = 'form-msg error';
    msg.textContent = 'Imeshindwa kufikia server. Hakikisha backend inaendesha (node server.js).';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Jisajili';
  }
});
</script>

</body>
</html>
